<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C Universe — learn C by watching it run</title>
<meta name="description" content="An interactive C programming course with a live memory simulator, CPU visualiser, compiler X-ray, pointer arrows and step-by-step execution you can rewind.">
<style>
/* ===================== C-UNIVERSE — design system ===================== */
:root{
  --bg:#05070e; --bg2:#080c17;
  --panel:rgba(255,255,255,.045);
  --panel2:rgba(255,255,255,.028);
  --stroke:rgba(255,255,255,.10);
  --stroke2:rgba(255,255,255,.06);
  --txt:#e9edf7; --txt2:#9aa6c2; --txt3:#65708c;
  --cyan:#22d3ee; --violet:#a78bfa; --pink:#f472b6; --green:#34d399;
  --amber:#fbbf24; --red:#fb7185; --blue:#60a5fa; --orange:#fb923c;
  --shadow:0 20px 60px -20px rgba(0,0,0,.85);
  --r:18px; --r2:12px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
}
html[data-theme="light"]{
  --bg:#f4f6fc; --bg2:#eaeefa;
  --panel:rgba(255,255,255,.75); --panel2:rgba(255,255,255,.55);
  --stroke:rgba(20,30,60,.12); --stroke2:rgba(20,30,60,.07);
  --txt:#111a33; --txt2:#4a5878; --txt3:#7b87a5;
  --shadow:0 18px 50px -22px rgba(30,50,110,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- animated background ---------- */
#bgwrap{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(1200px 700px at 12% -10%, rgba(34,211,238,.14), transparent 60%),
  radial-gradient(1000px 700px at 92% 8%, rgba(167,139,250,.16), transparent 60%),
  radial-gradient(900px 600px at 50% 110%, rgba(244,114,182,.10), transparent 60%),
  linear-gradient(160deg,var(--bg),var(--bg2));}
#particles{position:absolute;inset:0;width:100%;height:100%}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.4;animation:float 26s ease-in-out infinite}
.blob.b1{width:420px;height:420px;background:#22d3ee33;top:-120px;left:-80px}
.blob.b2{width:520px;height:520px;background:#a78bfa30;bottom:-180px;right:-120px;animation-delay:-8s}
.blob.b3{width:340px;height:340px;background:#f472b628;top:40%;left:55%;animation-delay:-15s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.08)}66%{transform:translate(-40px,50px) scale(.95)}}
.grid-overlay{position:absolute;inset:0;opacity:.25;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(circle at 50% 30%,#000,transparent 78%)}

/* ---------- app frame ---------- */
#app{position:relative;z-index:1;display:flex;height:100vh}
.rail{width:74px;flex:0 0 74px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;
  background:var(--panel2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid var(--stroke2);z-index:5}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:19px;
  background:linear-gradient(140deg,var(--cyan),var(--violet));color:#04121a;box-shadow:0 8px 24px -8px var(--cyan);margin-bottom:14px;cursor:pointer;
  transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.logo:hover{transform:rotate(-8deg) scale(1.08)}
.railbtn{width:46px;height:46px;border-radius:14px;border:1px solid transparent;background:transparent;color:var(--txt3);
  display:grid;place-items:center;cursor:pointer;position:relative;transition:.22s}
.railbtn svg{width:21px;height:21px;stroke-width:1.7}
.railbtn:hover{color:var(--txt);background:var(--panel);border-color:var(--stroke2)}
.railbtn.on{color:var(--cyan);background:linear-gradient(140deg,rgba(34,211,238,.16),rgba(167,139,250,.10));border-color:rgba(34,211,238,.32);
  box-shadow:0 0 0 1px rgba(34,211,238,.10),0 10px 26px -14px var(--cyan)}
.railbtn::after{content:attr(data-tip);position:absolute;left:56px;white-space:nowrap;background:#0b1020;color:#e8edf9;
  border:1px solid var(--stroke);padding:6px 10px;border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transform:translateX(-6px);transition:.18s;z-index:60}
.railbtn:hover::after{opacity:1;transform:translateX(0)}
.rail .spacer{flex:1}

.shell{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:62px;flex:0 0 62px;display:flex;align-items:center;gap:14px;padding:0 22px;
  border-bottom:1px solid var(--stroke2);background:var(--panel2);backdrop-filter:blur(24px)}
.crumb{font-size:13px;color:var(--txt2);display:flex;align-items:center;gap:8px;min-width:0}
.crumb b{color:var(--txt);font-weight:600}
.crumb .dot{opacity:.4}
.topspace{flex:1}
.chip{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:11px;background:var(--panel);
  border:1px solid var(--stroke2);font-size:12.5px;font-weight:600;color:var(--txt2);white-space:nowrap}
.chip b{color:var(--txt)}
.chip.fire b{color:var(--orange)} .chip.coin b{color:var(--amber)} .chip.gem b{color:var(--cyan)}
.xpwrap{width:180px}
.xpbar{height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:5px}
.xpfill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .8s cubic-bezier(.2,.9,.2,1);
  box-shadow:0 0 14px -2px var(--cyan)}
.xplab{font-size:10.5px;color:var(--txt3);letter-spacing:.08em;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between}
.iconbtn{width:36px;height:36px;border-radius:11px;background:var(--panel);border:1px solid var(--stroke2);color:var(--txt2);
  display:grid;place-items:center;cursor:pointer;transition:.2s}
.iconbtn:hover{color:var(--txt);border-color:var(--stroke)}
.iconbtn svg{width:17px;height:17px}

main{flex:1;overflow:auto;scroll-behavior:smooth;position:relative}
.pad{padding:34px 40px 70px;max-width:1500px;margin:0 auto}
@media(max-width:820px){.pad{padding:22px 16px 60px}}

/* ---------- glass primitives ---------- */
.glass{background:var(--panel);border:1px solid var(--stroke2);border-radius:var(--r);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow)}
.card{background:var(--panel);border:1px solid var(--stroke2);border-radius:var(--r);padding:20px;backdrop-filter:blur(18px);transition:.25s}
.card:hover{border-color:var(--stroke)}
h1{font-size:clamp(30px,4.4vw,54px);line-height:1.03;margin:0 0 14px;letter-spacing:-.032em;font-weight:800}
h2{font-size:23px;margin:0 0 12px;letter-spacing:-.02em;font-weight:700}
h3{font-size:15.5px;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
p{line-height:1.68;color:var(--txt2);margin:0 0 12px;font-size:15px}
.lead{font-size:17.5px;color:var(--txt2);line-height:1.62;max-width:62ch}
.grad{background:linear-gradient(100deg,var(--cyan),var(--violet) 45%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);font-weight:800;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:13px;border:1px solid var(--stroke);
  background:var(--panel);color:var(--txt);font-weight:650;font-size:14px;cursor:pointer;transition:.22s}
.btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#04121a;border:none;box-shadow:0 14px 34px -14px var(--cyan)}
.btn.primary:hover{box-shadow:0 18px 42px -12px var(--cyan)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.tag{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.04em;
  background:rgba(34,211,238,.12);color:var(--cyan);border:1px solid rgba(34,211,238,.22)}
.tag.v{background:rgba(167,139,250,.12);color:var(--violet);border-color:rgba(167,139,250,.22)}
.tag.g{background:rgba(52,211,153,.12);color:var(--green);border-color:rgba(52,211,153,.22)}
.tag.a{background:rgba(251,191,36,.12);color:var(--amber);border-color:rgba(251,191,36,.22)}
.tag.p{background:rgba(244,114,182,.12);color:var(--pink);border-color:rgba(244,114,182,.22)}
.mono{font-family:var(--mono)}
.reveal{opacity:0;transform:translateY(18px);animation:rise .65s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:38px;align-items:center;padding:26px 0 42px}
@media(max-width:1000px){.hero{grid-template-columns:1fr}}
.hero-badges{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 26px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:26px}
.stat{padding:16px 18px;border-radius:15px;background:var(--panel);border:1px solid var(--stroke2)}
.stat .n{font-size:27px;font-weight:800;letter-spacing:-.03em}
.stat .l{font-size:11.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-top:3px}
.termcard{border-radius:20px;overflow:hidden;border:1px solid var(--stroke);background:#080c17;box-shadow:var(--shadow)}
.termbar{height:38px;display:flex;align-items:center;gap:7px;padding:0 14px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--stroke2)}
.tdot{width:11px;height:11px;border-radius:50%}
.termbody{padding:18px;font-family:var(--mono);font-size:13px;line-height:1.85;min-height:230px}
.type-caret{display:inline-block;width:8px;background:var(--cyan);animation:blink 1s steps(2) infinite;color:transparent}
@keyframes blink{50%{opacity:0}}
.featgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:16px;margin-top:14px}
.feat{padding:20px;border-radius:16px;background:var(--panel);border:1px solid var(--stroke2);cursor:pointer;transition:.28s;position:relative;overflow:hidden}
.feat:hover{transform:translateY(-4px);border-color:var(--stroke)}
.feat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:13px;font-size:19px}
.feat h3{margin-bottom:5px}
.feat p{font-size:13.2px;margin:0;line-height:1.55}

/* ---------- roadmap ---------- */
.roadwrap{position:relative;margin-top:26px}
.roadline{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.13) 8%,rgba(255,255,255,.13) 92%,transparent)}
@media(max-width:900px){.roadline{left:26px}}
.node{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;margin-bottom:16px;position:relative}
@media(max-width:900px){.node{grid-template-columns:56px 1fr;gap:10px}.node .spacerCol{display:none}}
.orb{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;justify-self:center;font-weight:800;font-size:15px;
  background:var(--bg2);border:1px solid var(--stroke);color:var(--txt3);position:relative;z-index:2;transition:.3s}
.node.done .orb{background:linear-gradient(140deg,var(--green),#10b981);color:#04231a;border:none;box-shadow:0 0 0 5px rgba(52,211,153,.12)}
.node.open .orb{background:linear-gradient(140deg,var(--cyan),var(--violet));color:#04121a;border:none;box-shadow:0 0 0 6px rgba(34,211,238,.12),0 12px 30px -12px var(--cyan)}
.node.open .orb::after{content:"";position:absolute;inset:-8px;border-radius:24px;border:1.5px solid rgba(34,211,238,.4);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.86);opacity:.9}100%{transform:scale(1.28);opacity:0}}
.mcard{padding:16px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--stroke2);cursor:pointer;transition:.26s;position:relative}
.mcard:hover{transform:translateY(-3px);border-color:var(--stroke);background:var(--panel)}
.mcard.locked{opacity:.5;cursor:not-allowed}
.mcard.locked:hover{transform:none}
.mcard .mt{font-weight:700;font-size:15.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.mcard .mb{font-size:13px;color:var(--txt2);margin-top:5px;line-height:1.5}
.mcard .mmeta{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;align-items:center}
.right .mcard{grid-column:3}
.left .mcard{grid-column:1}
@media(max-width:900px){.right .mcard,.left .mcard{grid-column:2}}
.phase-head{display:flex;align-items:center;gap:12px;margin:34px 0 18px;position:relative;z-index:3}
.phase-head .pl{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;padding:6px 14px;border-radius:99px;
  background:var(--bg2);border:1px solid var(--stroke)}

/* ---------- lesson ---------- */
.lesshead{display:flex;align-items:flex-start;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.lessicon{width:60px;height:60px;border-radius:19px;display:grid;place-items:center;font-size:27px;
  background:linear-gradient(140deg,rgba(34,211,238,.2),rgba(167,139,250,.16));border:1px solid var(--stroke)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 22px;padding:5px;border-radius:15px;background:var(--panel2);border:1px solid var(--stroke2);width:fit-content;max-width:100%}
.tab{padding:9px 15px;border-radius:11px;border:none;background:transparent;color:var(--txt2);font-size:13.2px;font-weight:650;cursor:pointer;transition:.2s;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--txt)}
.tab.on{background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(167,139,250,.14));color:var(--txt);box-shadow:inset 0 0 0 1px rgba(34,211,238,.22)}
.story{max-width:74ch}
.story p{font-size:16px;line-height:1.78}
.story .big{font-size:20px;color:var(--txt);font-weight:600;line-height:1.6;margin:18px 0}
.ideas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:22px 0}
.idea{padding:18px;border-radius:15px;background:var(--panel);border:1px solid var(--stroke2);position:relative;overflow:hidden}
.idea::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}
.idea:nth-child(2)::before{background:var(--violet)}
.idea:nth-child(3)::before{background:var(--pink)}
.idea:nth-child(4)::before{background:var(--green)}
.idea h3{font-size:14.5px}
.idea p{font-size:13.4px;margin:0;line-height:1.6}
.callout{border-radius:15px;padding:16px 18px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.24);display:flex;gap:13px;margin:18px 0}
.callout .ci{font-size:20px}
.callout p{margin:0;font-size:14px;color:var(--txt)}
.analogy{border-radius:16px;padding:20px 22px;background:linear-gradient(135deg,rgba(167,139,250,.1),rgba(34,211,238,.06));
  border:1px solid rgba(167,139,250,.24);margin:20px 0}
.analogy .t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);font-weight:800;margin-bottom:9px}

/* ---------- playground ---------- */
.lab{display:grid;grid-template-columns:minmax(340px,.95fr) 1.25fr;gap:16px;align-items:start}
@media(max-width:1150px){.lab{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--stroke2);border-radius:var(--r);overflow:hidden;backdrop-filter:blur(18px)}
.phead{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--stroke2);background:var(--panel2)}
.phead .pt{font-size:12px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2)}
.phead .sp{flex:1}
.editor-wrap{position:relative;font-family:var(--mono);font-size:13.2px;line-height:21px;overflow:auto;max-height:430px;background:#070b14}
html[data-theme="light"] .editor-wrap{background:#fbfcff}
.ed-grid{display:grid;grid-template-columns:46px 1fr;min-height:100%}
.gutter{padding:14px 0;text-align:right;color:var(--txt3);user-select:none;font-size:12px;background:rgba(255,255,255,.02);border-right:1px solid var(--stroke2)}
.gutter div{padding-right:10px;height:21px}
.gutter div.cur{color:var(--cyan);font-weight:700;background:rgba(34,211,238,.10)}
.gutter div.err{color:var(--red);font-weight:700;background:rgba(251,113,133,.12)}
.code-area{position:relative}
#codehl,.codehl{margin:0;padding:14px 14px 14px 12px;white-space:pre;pointer-events:none;font:inherit;min-height:100%}
.codeta{position:absolute;inset:0;width:100%;height:100%;padding:14px 14px 14px 12px;margin:0;border:0;outline:0;resize:none;
  background:transparent;color:transparent;caret-color:var(--cyan);font:inherit;white-space:pre;overflow:hidden;letter-spacing:normal}
.hl-line{position:absolute;left:0;right:0;height:21px;background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(34,211,238,.02));
  border-left:2px solid var(--cyan);pointer-events:none;transition:top .28s cubic-bezier(.2,.9,.2,1)}
.hl-line.err{background:linear-gradient(90deg,rgba(251,113,133,.2),transparent);border-left-color:var(--red)}
.k-kw{color:#c084fc}.k-ty{color:#22d3ee}.k-num{color:#fbbf24}.k-str{color:#86efac}.k-cm{color:#5b6785;font-style:italic}
.k-fn{color:#60a5fa}.k-op{color:#f472b6}.k-pp{color:#fb923c}.k-id{color:#dbe3f5}
html[data-theme="light"] .k-id{color:#1b2540}
html[data-theme="light"] .k-cm{color:#8792ad}

.toolbar{display:flex;align-items:center;gap:7px;padding:10px 13px;border-bottom:1px solid var(--stroke2);flex-wrap:wrap;background:var(--panel2)}
.tb{width:34px;height:34px;border-radius:10px;border:1px solid var(--stroke2);background:var(--panel);color:var(--txt2);
  display:grid;place-items:center;cursor:pointer;transition:.18s}
.tb:hover:not(:disabled){color:var(--txt);border-color:var(--stroke);transform:translateY(-1px)}
.tb:disabled{opacity:.3;cursor:not-allowed}
.tb svg{width:15px;height:15px}
.tb.play{background:linear-gradient(135deg,var(--green),#059669);color:#03221a;border:none;width:auto;padding:0 14px;gap:7px;font-weight:700;font-size:12.5px;display:flex;align-items:center}
.tb.run{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#04121a;border:none;width:auto;padding:0 16px;gap:7px;font-weight:750;font-size:12.5px;display:flex;align-items:center}
.speed{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt3);font-weight:700}
.speed input{width:82px;accent-color:var(--cyan)}
.scrub{flex:1;min-width:120px;display:flex;align-items:center;gap:9px}
.scrub input{flex:1;accent-color:var(--violet)}
.stepcount{font-family:var(--mono);font-size:11.5px;color:var(--txt3);white-space:nowrap}

.vtabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--stroke2);overflow-x:auto;background:var(--panel2)}
.vtab{padding:7px 12px;border-radius:9px;border:none;background:transparent;color:var(--txt3);font-size:12.2px;font-weight:650;cursor:pointer;white-space:nowrap;transition:.18s}
.vtab:hover{color:var(--txt2)}
.vtab.on{background:rgba(34,211,238,.14);color:var(--cyan)}
.vbody{padding:16px;min-height:330px;max-height:560px;overflow:auto;position:relative}

/* narration */
.narr{margin-top:14px;border-radius:16px;padding:15px 18px;background:linear-gradient(135deg,rgba(34,211,238,.09),rgba(167,139,250,.06));
  border:1px solid rgba(34,211,238,.2);display:flex;gap:14px;align-items:flex-start}
.narr .nn{width:32px;height:32px;border-radius:10px;background:linear-gradient(140deg,var(--cyan),var(--violet));display:grid;place-items:center;color:#04121a;font-weight:800;flex:0 0 32px}
.narr .ntitle{font-family:var(--mono);font-size:12.5px;color:var(--cyan);font-weight:700;margin-bottom:5px}
.narr .nwhy{font-size:14.2px;line-height:1.62;color:var(--txt);margin:0}

/* memory simulator */
.segs{display:flex;flex-direction:column;gap:14px}
.seg{border-radius:14px;border:1px solid var(--stroke2);overflow:hidden}
.seghead{display:flex;align-items:center;gap:9px;padding:8px 13px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  background:rgba(255,255,255,.03);color:var(--txt3)}
.seghead .rng{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:0;text-transform:none;font-weight:600}
.segbody{padding:12px;display:flex;flex-direction:column;gap:9px}
.frameGrp{border-radius:11px;border:1px dashed rgba(255,255,255,.13);padding:9px;position:relative}
.frameGrp .fname{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--violet);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.frameGrp.top{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.05)}
.varrow{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:7px 9px;border-radius:11px;transition:.3s;border:1px solid transparent}
.varrow.hit{background:rgba(34,211,238,.09);border-color:rgba(34,211,238,.3);animation:flash .8s ease}
@keyframes flash{0%{background:rgba(34,211,238,.34)}100%{background:rgba(34,211,238,.09)}}
.vlabel{min-width:104px}
.vlabel .vn{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--txt)}
.vlabel .vt{font-family:var(--mono);font-size:10.5px;color:var(--txt3)}
.vaddr{font-family:var(--mono);font-size:10.5px;color:var(--cyan);opacity:.85}
.cells{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.cellbytes{display:flex;gap:2px}
.byte{width:26px;height:28px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:700;
  background:rgba(255,255,255,.05);border:1px solid var(--stroke2);color:var(--txt2);transition:.3s;cursor:help}
.byte.set{background:linear-gradient(160deg,rgba(34,211,238,.2),rgba(34,211,238,.07));border-color:rgba(34,211,238,.34);color:#bff4ff}
.byte.hot{animation:bytepop .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes bytepop{0%{transform:scale(1)}35%{transform:scale(1.34);box-shadow:0 0 20px -2px var(--cyan)}100%{transform:scale(1)}}
.cellval{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--green)}
.cellidx{font-family:var(--mono);font-size:9.5px;color:var(--txt3)}
.ptrbadge{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:6px;background:rgba(244,114,182,.14);color:var(--pink);border:1px solid rgba(244,114,182,.3)}
#arrows{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:4}
.arrowpath{fill:none;stroke:var(--pink);stroke-width:1.8;marker-end:url(#ah);opacity:.9;
  stroke-dasharray:5 4;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
.raw-grid{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.rawb{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.04);font-family:var(--mono);font-size:8px;display:grid;place-items:center;color:var(--txt3)}
.rawb.used{background:rgba(34,211,238,.22);color:#cbf7ff}
.tip{position:fixed;z-index:99;background:#0a1020;border:1px solid var(--stroke);border-radius:10px;padding:9px 12px;font-size:11.5px;
  font-family:var(--mono);color:var(--txt);pointer-events:none;box-shadow:var(--shadow);max-width:280px;line-height:1.6}

/* CPU */
.cpuwrap{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
@media(max-width:760px){.cpuwrap{grid-template-columns:1fr}}
.chip3d{border-radius:16px;border:1px solid var(--stroke);padding:16px;background:
  radial-gradient(400px 200px at 30% 0%,rgba(34,211,238,.09),transparent 70%),rgba(255,255,255,.02)}
.chiplabel{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--txt3);margin-bottom:12px}
.cycle{display:flex;gap:8px;margin-bottom:14px}
.cyc{flex:1;text-align:center;padding:10px 6px;border-radius:11px;border:1px solid var(--stroke2);font-size:11.5px;font-weight:750;color:var(--txt3);transition:.3s}
.cyc.on{border-color:rgba(34,211,238,.45);background:linear-gradient(160deg,rgba(34,211,238,.18),rgba(34,211,238,.05));color:var(--cyan);
  box-shadow:0 0 22px -8px var(--cyan);transform:translateY(-2px)}
.regs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.reg{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.035);border:1px solid var(--stroke2)}
.reg .rn{font-family:var(--mono);font-size:11px;color:var(--txt3);font-weight:700}
.reg .rv{font-family:var(--mono);font-size:12px;color:var(--amber);font-weight:700}
.reg.wide{grid-column:1/-1}
.reg.wide .rv{color:var(--cyan);font-size:11.5px}
.alu{margin-top:12px;border-radius:12px;padding:13px;border:1px solid var(--stroke2);text-align:center;background:rgba(255,255,255,.02);transition:.3s}
.alu.active{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.08);box-shadow:0 0 26px -10px var(--amber)}
.alu .av{font-family:var(--mono);font-size:16px;font-weight:800;color:var(--amber)}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;border:1px solid var(--stroke2);background:rgba(255,255,255,.02);transition:.3s}
.part .pi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:rgba(255,255,255,.05)}
.part .pn{font-size:13px;font-weight:700}
.part .pd{font-size:11px;color:var(--txt3)}
.part.lit{border-color:rgba(34,211,238,.45);background:linear-gradient(120deg,rgba(34,211,238,.14),transparent);
  box-shadow:0 0 30px -14px var(--cyan);transform:translateX(4px)}
.part.lit .pi{background:linear-gradient(140deg,var(--cyan),var(--violet));color:#04121a}
.bus{height:3px;border-radius:3px;background:rgba(255,255,255,.07);margin:4px 0;overflow:hidden;position:relative}
.bus i{position:absolute;left:-30%;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:busmove 1.4s linear infinite}
@keyframes busmove{to{left:100%}}

/* stack */
.stackwrap{display:flex;flex-direction:column-reverse;gap:8px}
.sframe{border-radius:13px;border:1px solid var(--stroke2);padding:12px 14px;background:rgba(255,255,255,.025);animation:pushin .38s cubic-bezier(.2,1.2,.35,1)}
@keyframes pushin{from{opacity:0;transform:translateY(-14px) scale(.97)}}
.sframe.topf{border-color:rgba(167,139,250,.45);background:linear-gradient(135deg,rgba(167,139,250,.12),transparent);box-shadow:0 0 30px -16px var(--violet)}
.sframe .sh{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.sframe .fn{font-family:var(--mono);font-size:13px;font-weight:750;color:var(--violet)}
.sframe .ret{font-size:10.5px;color:var(--txt3);margin-left:auto;font-family:var(--mono)}
.sframe .lv{display:flex;gap:7px;flex-wrap:wrap}
.lvchip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid var(--stroke2)}
.heapblk{border-radius:11px;border:1px solid rgba(52,211,153,.3);background:rgba(52,211,153,.07);padding:10px 12px;margin-bottom:8px}
.heapblk.freed{border-color:rgba(251,113,133,.3);background:rgba(251,113,133,.06);opacity:.65}

/* compiler pipeline */
.pipe{display:flex;flex-direction:column;gap:5px}
.stage{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:1px solid var(--stroke2);
  background:rgba(255,255,255,.02);transition:.4s;opacity:.4}
.stage.done{opacity:1;border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.05)}
.stage.act{opacity:1;border-color:rgba(34,211,238,.5);background:linear-gradient(110deg,rgba(34,211,238,.14),transparent);
  transform:scale(1.015);box-shadow:0 0 34px -16px var(--cyan)}
.stage .sn{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;background:rgba(255,255,255,.06);color:var(--txt3)}
.stage.done .sn{background:var(--green);color:#04231a}
.stage.act .sn{background:linear-gradient(140deg,var(--cyan),var(--violet));color:#04121a}
.stage .st{font-size:13.5px;font-weight:700}
.stage .sd{font-size:11.5px;color:var(--txt3)}
.stage .arrow{margin-left:auto;color:var(--txt3);font-size:14px}
.tokline{display:flex;gap:5px;flex-wrap:wrap}
.tok{font-family:var(--mono);font-size:11px;padding:3px 7px;border-radius:6px;border:1px solid var(--stroke2);background:rgba(255,255,255,.04);
  animation:pop .3s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.tok.kw{color:#c084fc;border-color:rgba(192,132,252,.3)}
.tok.id{color:#dbe3f5}.tok.num{color:var(--amber);border-color:rgba(251,191,36,.3)}
.tok.op{color:var(--pink);border-color:rgba(244,114,182,.3)}.tok.str{color:#86efac;border-color:rgba(134,239,172,.3)}
.tok.pp{color:var(--orange)}
.astline{font-family:var(--mono);font-size:11.5px;color:var(--txt2);white-space:pre;line-height:1.65}
.astline b{color:var(--cyan);font-weight:600}
.astline i{color:var(--txt3);font-style:normal;font-size:10.5px}
.simtable{width:100%;border-collapse:collapse;font-size:12px}
.simtable th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);padding:6px 9px;border-bottom:1px solid var(--stroke2)}
.simtable td{padding:6px 9px;border-bottom:1px solid var(--stroke2);font-family:var(--mono);font-size:11.5px}
.asmline{display:flex;gap:12px;align-items:center;font-family:var(--mono);font-size:11.5px;padding:4px 8px;border-radius:7px}
.asmline.cur{background:rgba(34,211,238,.12);color:var(--cyan)}
.asmline .ad{color:var(--txt3);font-size:10.5px}
.asmline .mc{color:var(--amber);font-size:10.5px}
.asmline .bin{color:var(--txt3);font-size:9.5px;letter-spacing:.03em}

/* flowchart */
.flow{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.fnode{position:relative;padding:9px 16px;border-radius:10px;border:1px solid var(--stroke2);background:rgba(255,255,255,.035);
  font-size:12.5px;font-family:var(--mono);transition:.3s;max-width:100%}
.fnode.cur{border-color:var(--cyan);background:rgba(34,211,238,.14);box-shadow:0 0 24px -12px var(--cyan)}
.fnode.dec{border-radius:4px;transform:none;border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.07);
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);padding:9px 26px}
.fnode.start,.fnode.stop{border-radius:99px;background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.32);font-weight:700}
.fnode.out{border-color:rgba(96,165,250,.34);background:rgba(96,165,250,.08)}
.fnode.loop{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.08)}
.fconn{width:2px;height:16px;background:var(--stroke);margin-left:22px;position:relative}
.fconn::after{content:"";position:absolute;bottom:0;left:-3px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--stroke)}
.fbranch{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--txt3);padding:2px 0 2px 8px}
.pseudo{font-family:var(--mono);font-size:12.8px;line-height:1.9;white-space:pre-wrap;color:var(--txt2)}
.pseudo .h{color:var(--cyan);font-weight:700}

/* output */
.outbox{font-family:var(--mono);font-size:13px;line-height:1.75;white-space:pre-wrap;min-height:90px;padding:14px;border-radius:12px;
  background:#05080f;border:1px solid var(--stroke2);color:#c8f7d4}
html[data-theme="light"] .outbox{background:#0b1020}
.outcaret{display:inline-block;width:8px;height:14px;background:var(--green);animation:blink 1s steps(2) infinite;vertical-align:-2px}
.errbox{border-radius:14px;border:1px solid rgba(251,113,133,.35);background:rgba(251,113,133,.07);padding:16px 18px;margin-top:12px}
.errbox .et{font-weight:750;color:var(--red);font-size:14.5px;display:flex;gap:9px;align-items:center;margin-bottom:8px}
.errbox p{color:var(--txt);font-size:14px;margin:0 0 10px}
.errbox .fix{font-family:var(--mono);font-size:12.5px;background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.28);
  border-radius:10px;padding:11px 13px;color:#bff6d8;white-space:pre-wrap}

/* quiz */
.quiz{max-width:820px}
.qcard{border-radius:17px;border:1px solid var(--stroke2);background:var(--panel);padding:22px;margin-bottom:14px}
.qmeta{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.qq{font-size:16px;font-weight:600;line-height:1.55;margin-bottom:15px;color:var(--txt)}
.qq code,.icode{font-family:var(--mono);background:rgba(34,211,238,.1);padding:2px 6px;border-radius:5px;font-size:.92em;color:var(--cyan)}
.qcode{font-family:var(--mono);font-size:12.5px;line-height:1.7;background:#070b14;border:1px solid var(--stroke2);border-radius:11px;
  padding:13px 15px;margin-bottom:15px;white-space:pre;overflow:auto}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:13px 16px;border-radius:12px;border:1px solid var(--stroke2);background:rgba(255,255,255,.025);
  cursor:pointer;font-size:14px;transition:.2s;display:flex;align-items:center;gap:11px}
.opt:hover:not(.dis){border-color:var(--stroke);transform:translateX(3px)}
.opt .ol{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--txt3);flex:0 0 24px}
.opt.right{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.11)}
.opt.right .ol{background:var(--green);color:#04231a}
.opt.wrong{border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.09)}
.opt.wrong .ol{background:var(--red);color:#2a0410}
.opt.dis{cursor:default}
.expl{margin-top:13px;border-radius:12px;padding:13px 15px;background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.22);
  font-size:13.5px;line-height:1.65;color:var(--txt);animation:rise .4s ease backwards}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--cyan);text-align:center;font-family:var(--mono);color:var(--cyan)}
.fillinput{font-family:var(--mono);font-size:14px;padding:9px 13px;border-radius:10px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.04);color:var(--txt);width:190px}
.fillinput:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.14)}
.dragzone{display:flex;flex-wrap:wrap;gap:8px;padding:14px;border-radius:12px;border:1.5px dashed var(--stroke);min-height:56px;margin-bottom:11px}
.dragzone.over{border-color:var(--cyan);background:rgba(34,211,238,.06)}
.dchip{font-family:var(--mono);font-size:12.5px;padding:8px 13px;border-radius:9px;background:rgba(255,255,255,.06);
  border:1px solid var(--stroke2);cursor:grab;user-select:none;transition:.18s}
.dchip:active{cursor:grabbing;transform:scale(.96)}
.dchip.placed{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.3)}
.orderlist{display:flex;flex-direction:column;gap:7px}
.orderitem{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:11px;background:rgba(255,255,255,.04);
  border:1px solid var(--stroke2);font-family:var(--mono);font-size:12.5px;cursor:grab}
.orderitem .grip{color:var(--txt3);font-size:14px}
.orderitem.dragging{opacity:.4}

/* toys */
.bits{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.bit{width:46px;height:56px;border-radius:11px;border:1px solid var(--stroke2);background:rgba(255,255,255,.04);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:.2s;font-family:var(--mono)}
.bit:hover{transform:translateY(-3px);border-color:var(--stroke)}
.bit .bv{font-size:20px;font-weight:800;color:var(--txt3)}
.bit .bw{font-size:9px;color:var(--txt3)}
.bit.on{background:linear-gradient(160deg,rgba(34,211,238,.26),rgba(167,139,250,.14));border-color:rgba(34,211,238,.5)}
.bit.on .bv{color:var(--cyan)}
.bit.on .bw{color:var(--txt2)}
.bigval{text-align:center;font-family:var(--mono);font-size:38px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.convrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-top:14px}
.conv{padding:13px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--stroke2);text-align:center}
.conv .cl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);font-weight:800}
.conv .cv{font-family:var(--mono);font-size:16px;font-weight:750;margin-top:4px;color:var(--cyan)}
.boxdrop{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}
@media(max-width:700px){.boxdrop{grid-template-columns:1fr}}
.vbox{height:130px;border-radius:16px;border:2px dashed var(--stroke);display:grid;place-items:center;position:relative;transition:.28s;background:rgba(255,255,255,.02)}
.vbox.over{border-color:var(--cyan);background:rgba(34,211,238,.08);transform:scale(1.03)}
.vbox .lbl{position:absolute;top:-11px;left:14px;font-family:var(--mono);font-size:11.5px;padding:2px 9px;border-radius:6px;background:var(--bg2);border:1px solid var(--stroke);color:var(--cyan)}
.vbox .val{font-family:var(--mono);font-size:30px;font-weight:800;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.vbox .empty{color:var(--txt3);font-size:12.5px}
.typebar{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.typebar .tn{font-family:var(--mono);font-size:12.5px;width:74px;color:var(--txt)}
.typebar .tbar{height:26px;border-radius:7px;background:linear-gradient(90deg,var(--cyan),var(--violet));display:flex;align-items:center;
  padding:0 9px;font-family:var(--mono);font-size:11px;font-weight:700;color:#04121a;transition:width .6s cubic-bezier(.2,.9,.2,1)}
.typebar .tr{font-size:11px;color:var(--txt3);font-family:var(--mono)}

/* badges / profile */
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.badge{padding:18px 14px;border-radius:16px;text-align:center;border:1px solid var(--stroke2);background:var(--panel);transition:.25s}
.badge.locked{opacity:.32;filter:grayscale(1)}
.badge:not(.locked):hover{transform:translateY(-4px) scale(1.02);border-color:var(--stroke)}
.badge .bi{font-size:32px;margin-bottom:9px}
.badge .bn{font-size:13px;font-weight:750}
.badge .bd{font-size:11px;color:var(--txt3);margin-top:4px;line-height:1.45}
.cert{border-radius:20px;padding:38px;text-align:center;background:linear-gradient(140deg,rgba(34,211,238,.09),rgba(167,139,250,.07));
  border:1.5px solid rgba(34,211,238,.28);position:relative;overflow:hidden}
.cert h2{font-size:29px;margin-bottom:6px}
.cert .nm{font-size:33px;font-weight:800;letter-spacing:-.02em;margin:16px 0;background:linear-gradient(100deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}

/* teacher */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width 1s cubic-bezier(.2,.9,.2,1)}
.bar.warn i{background:linear-gradient(90deg,var(--amber),var(--orange))}
.bar.bad i{background:linear-gradient(90deg,var(--red),#e11d48)}
.stutable{width:100%;border-collapse:collapse;font-size:13px}
.stutable th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);padding:10px;border-bottom:1px solid var(--stroke2)}
.stutable td{padding:11px 10px;border-bottom:1px solid var(--stroke2)}
.stutable tr:hover td{background:rgba(255,255,255,.02)}

/* AI tutor */
.tutor{position:fixed;right:22px;bottom:22px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:11px}
.tbtn{width:56px;height:56px;border-radius:19px;border:none;cursor:pointer;background:linear-gradient(140deg,var(--cyan),var(--violet));
  color:#04121a;font-size:23px;box-shadow:0 16px 40px -14px var(--cyan);transition:.28s;display:grid;place-items:center}
.tbtn:hover{transform:scale(1.08) rotate(-6deg)}
.tpanel{width:min(400px,92vw);max-height:min(560px,72vh);border-radius:20px;background:rgba(9,13,24,.94);border:1px solid var(--stroke);
  backdrop-filter:blur(28px);box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden}
html[data-theme="light"] .tpanel{background:rgba(255,255,255,.96)}
.tpanel.open{display:flex;animation:rise .32s cubic-bezier(.2,.9,.25,1)}
.thead{padding:14px 17px;border-bottom:1px solid var(--stroke2);display:flex;align-items:center;gap:11px}
.tmsgs{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:88%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.62}
.msg.bot{background:rgba(255,255,255,.05);border:1px solid var(--stroke2);align-self:flex-start;border-bottom-left-radius:5px}
.msg.me{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#04121a;align-self:flex-end;border-bottom-right-radius:5px;font-weight:550}
.msg code{font-family:var(--mono);font-size:.9em;background:rgba(0,0,0,.25);padding:1px 5px;border-radius:4px}
.tsug{display:flex;gap:6px;flex-wrap:wrap;padding:0 15px 12px}
.tsug button{font-size:11.5px;padding:6px 11px;border-radius:9px;border:1px solid var(--stroke2);background:rgba(255,255,255,.04);
  color:var(--txt2);cursor:pointer;transition:.18s}
.tsug button:hover{color:var(--txt);border-color:var(--stroke)}
.tinput{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--stroke2)}
.tinput input{flex:1;padding:10px 13px;border-radius:11px;border:1px solid var(--stroke2);background:rgba(255,255,255,.04);font-size:13.5px}
.tinput input:focus{outline:none;border-color:var(--cyan)}

/* toast + confetti */
#toasts{position:fixed;top:78px;right:22px;z-index:80;display:flex;flex-direction:column;gap:9px}
.toast{padding:13px 17px;border-radius:14px;background:rgba(9,13,24,.94);border:1px solid var(--stroke);backdrop-filter:blur(20px);
  box-shadow:var(--shadow);display:flex;gap:11px;align-items:center;animation:slidein .4s cubic-bezier(.2,1.1,.3,1);max-width:330px}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}}
.toast .ti{font-size:20px}
.toast .tt{font-size:13.5px;font-weight:700}
.toast .td{font-size:12px;color:var(--txt2);margin-top:2px}
.toast.out{animation:slideout .35s ease forwards}
@keyframes slideout{to{opacity:0;transform:translateX(40px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}

.empty-state{text-align:center;padding:60px 20px;color:var(--txt3)}
.empty-state .es{font-size:46px;margin-bottom:14px;opacity:.6}
.kbd{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.07);
  border:1px solid var(--stroke2);border-bottom-width:2px;color:var(--txt2)}
.split-note{font-size:12px;color:var(--txt3);margin-top:10px;line-height:1.6}
.sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.progress-ring{transform:rotate(-90deg)}
.progress-ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.progress-ring .bgc{stroke:rgba(255,255,255,.08)}
.progress-ring .fgc{stroke:url(#pg);transition:stroke-dashoffset 1s cubic-bezier(.2,.9,.2,1)}

</div>

    <header class="topbar">

      <div><div style="font-size:14px;font-weight:700">Ask the tutor</div>

</div>

<div id="toasts"></div>
<canvas id="confetti"></canvas>

<script>
/* =====================================================================
   C-UNIVERSE ENGINE
   A tiny C compiler + virtual machine that records every single step
   so the UI can scrub forwards and backwards through execution.
   ===================================================================== */
var CU = (function () {
"use strict";

/* ------------------------------------------------------------------ */
/*  ERRORS — always human first, compiler second                       */
/* ------------------------------------------------------------------ */
function CErr(line, title, msg, hint, phase) {
  const e = new Error(title);
  e.isCErr = true; e.line = line; e.title = title;
  e.msg = msg; e.hint = hint || ""; e.phase = phase || "compile";
  return e;
}

/* ------------------------------------------------------------------ */
/*  1. LEXER  (Tokenization)                                           */
/* ------------------------------------------------------------------ */
const KW = new Set(["int","char","float","double","void","short","long","unsigned","signed",
  "if","else","while","for","do","return","break","continue","struct","sizeof","const","static"]);
const TYPEWORDS = new Set(["int","char","float","double","void","short","long","unsigned","signed"]);

const OPS3 = ["<<=", ">>="];
const OPS2 = ["++","--","+=","-=","*=","/=","%=","==","!=","<=",">=","&&","||","->","<<",">>"];

function lex(src) {
  const toks = [];
  let i = 0, line = 1, col = 1;
  const push = (t, v, l, c) => toks.push({ t, v, line: l, col: c });
  while (i < src.length) {
    const ch = src[i];
    if (ch === "\n") { i++; line++; col = 1; continue; }
    if (ch === " " || ch === "\t" || ch === "\r") { i++; col++; continue; }
    if (ch === "/" && src[i + 1] === "/") { while (i < src.length && src[i] !== "\n") i++; continue; }
    if (ch === "/" && src[i + 1] === "*") {
      const sl = line; i += 2;
      while (i < src.length && !(src[i] === "*" && src[i + 1] === "/")) { if (src[i] === "\n") line++; i++; }
      if (i >= src.length) throw CErr(sl, "Unfinished comment",
        "You opened a comment with /* but never closed it with */.",
        "Add */ where the comment should end.");
      i += 2; continue;
    }
    if (ch === "#") {
      const sl = line; let s = "";
      while (i < src.length && src[i] !== "\n") { s += src[i]; i++; }
      push("pp", s.trim(), sl, col); continue;
    }
    if (/[0-9]/.test(ch) || (ch === "." && /[0-9]/.test(src[i + 1] || ""))) {
      const sc = col; let s = "";
      if (ch === "0" && (src[i + 1] === "x" || src[i + 1] === "X")) {
        s = "0x"; i += 2; col += 2;
        while (i < src.length && /[0-9a-fA-F]/.test(src[i])) { s += src[i]; i++; col++; }
        push("num", { val: parseInt(s, 16), isFloat: false, raw: s }, line, sc); continue;
      }
      let isF = false;
      while (i < src.length && /[0-9.eEfF]/.test(src[i])) {
        if (src[i] === "." || src[i] === "e" || src[i] === "E") isF = true;
        if ((src[i] === "f" || src[i] === "F")) { isF = true; i++; col++; break; }
        s += src[i]; i++; col++;
      }
      push("num", { val: parseFloat(s), isFloat: isF, raw: s }, line, sc); continue;
    }
    if (/[A-Za-z_]/.test(ch)) {
      const sc = col; let s = "";
      while (i < src.length && /[A-Za-z0-9_]/.test(src[i])) { s += src[i]; i++; col++; }
      push(KW.has(s) ? "kw" : "id", s, line, sc); continue;
    }
    if (ch === "'") {
      const sc = col; i++; col++;
      let v;
      if (src[i] === "\\") { v = escChar(src[i + 1]); i += 2; col += 2; }
      else { v = src.charCodeAt(i); i++; col++; }
      if (src[i] !== "'") throw CErr(line, "Broken character",
        "A character literal must hold exactly one character between single quotes.",
        "Write 'a' for one letter. For a word use double quotes: \"abc\".");
      i++; col++;
      push("chr", v, line, sc); continue;
    }
    if (ch === '"') {
      const sc = col, sl = line; i++; col++; let s = "";
      while (i < src.length && src[i] !== '"') {
        if (src[i] === "\n") throw CErr(sl, "Unfinished text",
          "A string opened with a double quote was never closed before the end of the line.",
          "Add a closing double quote at the end of your text.");
        if (src[i] === "\\") { s += String.fromCharCode(escChar(src[i + 1])); i += 2; col += 2; }
        else { s += src[i]; i++; col++; }
      }
      i++; col++;
      push("str", s, sl, sc); continue;
    }
    let matched = null;
    for (const o of OPS3) if (src.startsWith(o, i)) { matched = o; break; }
    if (!matched) for (const o of OPS2) if (src.startsWith(o, i)) { matched = o; break; }
    if (!matched) matched = ch;
    push("op", matched, line, col); i += matched.length; col += matched.length;
  }
  push("eof", null, line, col);
  return toks;
}
function escChar(c) {
  const m = { n: 10, t: 9, r: 13, "0": 0, "\\": 92, "'": 39, '"': 34, a: 7, b: 8, f: 12, v: 11 };
  return c in m ? m[c] : c.charCodeAt(0);
}

/* ------------------------------------------------------------------ */
/*  2. PARSER  (Syntax Analysis -> AST)                                */
/* ------------------------------------------------------------------ */
function parse(toks) {
  let p = 0;
  const peek = (k) => toks[Math.min(p + (k || 0), toks.length - 1)];
  const at = (t, v) => { const tk = peek(); return tk.t === t && (v === undefined || tk.v === v); };
  const atOp = (v) => at("op", v);
  const next = () => toks[p++];
  function expect(t, v, what) {
    if (!at(t, v)) {
      const tk = peek();
      const got = tk.t === "eof" ? "the end of the file" : "`" + String(tk.v && tk.v.raw ? tk.v.raw : tk.v) + "`";
      if (v === ";") throw CErr(toks[p - 1] ? toks[p - 1].line : tk.line, "Missing semicolon",
        "Every C statement ends with a semicolon ( ; ). I reached " + got + " and the previous statement was never closed.",
        "Put a ; at the end of that line.");
      if (v === ")") throw CErr(tk.line, "Missing closing bracket )",
        "I found an opening ( but no matching ). I reached " + got + " instead.",
        "Count your brackets - every ( needs exactly one ).");
      if (v === "}") throw CErr(tk.line, "Missing closing brace }",
        "A block that started with { was never closed. I reached " + got + ".",
        "Add a } to close the block.");
      throw CErr(tk.line, "Unexpected " + got,
        "I expected " + (what || "`" + v + "`") + " here but found " + got + ".",
        "Check the spelling and punctuation on this line.");
    }
    return next();
  }

  function isTypeStart() {
    const tk = peek();
    return tk.t === "kw" && TYPEWORDS.has(tk.v);
  }
  function parseType() {
    let base = "int", sawBase = false, unsigned = false;
    while (peek().t === "kw" && TYPEWORDS.has(peek().v)) {
      const w = next().v;
      if (w === "unsigned") unsigned = true;
      else if (w === "signed") { }
      else if (w === "long") { base = "long"; sawBase = true; }
      else if (w === "short") { base = "short"; sawBase = true; }
      else { base = w; sawBase = true; }
    }
    if (!sawBase) base = "int";
    let ptr = 0;
    while (atOp("*")) { next(); ptr++; }
    return { base: base, ptr: ptr, unsigned: unsigned };
  }

  function parseProgram() {
    const funcs = [], globals = [], pp = [];
    while (!at("eof")) {
      if (at("pp")) { pp.push(next().v); continue; }
      if (!isTypeStart()) {
        const tk = peek();
        throw CErr(tk.line, "I don't know what this is",
          "At the top level of a C file I expect a function (like `int main() { ... }`) or a global variable. I found `" + tk.v + "`.",
          "Did you forget `int main() {` around your code?");
      }
      const line = peek().line;
      const type = parseType();
      const nameTok = expect("id", undefined, "a name");
      if (atOp("(")) {
        next();
        const params = [];
        while (!atOp(")")) {
          if (isTypeStart()) {
            const pt = parseType();
            if (pt.base === "void" && pt.ptr === 0 && atOp(")")) break;
            const pn = expect("id", undefined, "a parameter name").v;
            let arr = false;
            if (atOp("[")) { next(); if (!atOp("]")) next(); expect("op", "]"); arr = true; pt.ptr++; }
            params.push({ type: pt, name: pn, arr: arr });
          } else throw CErr(peek().line, "Bad parameter list",
            "Parameters need a type and a name, like `int n`.", "Example: int add(int a, int b)");
          if (atOp(",")) next(); else break;
        }
        expect("op", ")");
        const body = parseBlock();
        funcs.push({ k: "Func", name: nameTok.v, ret: type, params: params, body: body, line: line });
      } else {
        globals.push(parseDeclTail(type, nameTok, line));
        expect("op", ";");
      }
    }
    return { k: "Program", funcs: funcs, globals: globals, pp: pp };
  }

  function parseDeclTail(type, nameTok, line) {
    const items = [];
    let curType = type, curName = nameTok;
    for (;;) {
      let arrLen = null, arrInit = null, init = null;
      if (atOp("[")) {
        next();
        if (!atOp("]")) arrLen = parseExpr();
        expect("op", "]");
        if (arrLen === null) arrLen = { k: "Auto" };
      }
      if (atOp("=")) {
        next();
        if (atOp("{")) {
          next(); arrInit = [];
          while (!atOp("}")) { arrInit.push(parseExpr()); if (atOp(",")) next(); else break; }
          expect("op", "}");
        } else init = parseExpr();
      }
      items.push({ type: curType, name: curName.v, arrLen: arrLen, arrInit: arrInit, init: init, line: curName.line });
      if (atOp(",")) {
        next();
        let ptr = 0; while (atOp("*")) { next(); ptr++; }
        curType = { base: type.base, ptr: ptr, unsigned: type.unsigned };
        curName = expect("id", undefined, "a variable name");
      } else break;
    }
    return { k: "Decl", items: items, line: line };
  }

  function parseBlock() {
    const line = peek().line;
    expect("op", "{");
    const stmts = [];
    while (!atOp("}")) {
      if (at("eof")) throw CErr(line, "Missing closing brace }",
        "The block that opened on line " + line + " was never closed.",
        "Add a } at the end of the block.");
      stmts.push(parseStmt());
    }
    expect("op", "}");
    return { k: "Block", stmts: stmts, line: line };
  }

  function parseStmt() {
    const tk = peek(), line = tk.line;
    if (atOp("{")) return parseBlock();
    if (atOp(";")) { next(); return { k: "Empty", line: line }; }
    if (isTypeStart()) {
      const type = parseType();
      const nameTok = expect("id", undefined, "a variable name");
      const d = parseDeclTail(type, nameTok, line);
      expect("op", ";");
      return d;
    }
    if (at("kw", "if")) {
      next(); expect("op", "("); const cond = parseExpr(); expect("op", ")");
      const then = parseStmt();
      let els = null;
      if (at("kw", "else")) { next(); els = parseStmt(); }
      return { k: "If", cond: cond, then: then, els: els, line: line };
    }
    if (at("kw", "while")) {
      next(); expect("op", "("); const cond = parseExpr(); expect("op", ")");
      const body = parseStmt();
      return { k: "While", cond: cond, body: body, line: line };
    }
    if (at("kw", "do")) {
      next(); const body = parseStmt();
      if (!at("kw", "while")) throw CErr(line, "do without while",
        "A do-block must be followed by while(condition);", "Example: do { ... } while (i < 5);");
      next(); expect("op", "("); const cond = parseExpr(); expect("op", ")"); expect("op", ";");
      return { k: "DoWhile", body: body, cond: cond, line: line };
    }
    if (at("kw", "for")) {
      next(); expect("op", "(");
      let init = null;
      if (!atOp(";")) {
        if (isTypeStart()) {
          const type = parseType(); const nameTok = expect("id", undefined, "a variable name");
          init = parseDeclTail(type, nameTok, line);
        } else init = { k: "ExprStmt", expr: parseExpr(), line: line };
      }
      expect("op", ";");
      const cond = atOp(";") ? null : parseExpr();
      expect("op", ";");
      const step = atOp(")") ? null : parseExpr();
      expect("op", ")");
      const body = parseStmt();
      return { k: "For", init: init, cond: cond, step: step, body: body, line: line };
    }
    if (at("kw", "return")) {
      next();
      const e = atOp(";") ? null : parseExpr();
      expect("op", ";");
      return { k: "Return", expr: e, line: line };
    }
    if (at("kw", "break")) { next(); expect("op", ";"); return { k: "Break", line: line }; }
    if (at("kw", "continue")) { next(); expect("op", ";"); return { k: "Continue", line: line }; }
    const e = parseExpr();
    expect("op", ";");
    return { k: "ExprStmt", expr: e, line: line };
  }

  function parseExpr() { return parseAssign(); }
  function parseAssign() {
    const left = parseTernary();
    const ops = ["=", "+=", "-=", "*=", "/=", "%="];
    if (peek().t === "op" && ops.indexOf(peek().v) >= 0) {
      const op = next().v, line = toks[p - 1].line;
      const right = parseAssign();
      if (!isLValue(left)) throw CErr(line, "Cannot store into this",
        "The left side of `=` must be something that can hold a value - a variable, an array slot, or *pointer.",
        "You wrote something like `5 = x;`. Flip it around: `x = 5;`");
      return { k: "Assign", op: op, target: left, value: right, line: line };
    }
    return left;
  }
  function parseTernary() {
    const c = parseOr();
    if (atOp("?")) {
      const line = next().line; const a = parseExpr(); expect("op", ":"); const b = parseTernary();
      return { k: "Cond", cond: c, a: a, b: b, line: line };
    }
    return c;
  }
  function mkBin(nextFn, ops) {
    return function () {
      let l = nextFn();
      while (peek().t === "op" && ops.indexOf(peek().v) >= 0) {
        const tkn = next();
        const r = nextFn();
        l = { k: "Bin", op: tkn.v, l: l, r: r, line: tkn.line };
      }
      return l;
    };
  }
  const parseUnaryRef = function () { return parseUnary(); };
  const parseMul = mkBin(parseUnaryRef, ["*", "/", "%"]);
  const parseAdd = mkBin(parseMul, ["+", "-"]);
  const parseShift = mkBin(parseAdd, ["<<", ">>"]);
  const parseRel = mkBin(parseShift, ["<", ">", "<=", ">="]);
  const parseEq = mkBin(parseRel, ["==", "!="]);
  const parseBAnd = mkBin(parseEq, ["&"]);
  const parseBXor = mkBin(parseBAnd, ["^"]);
  const parseBOr = mkBin(parseBXor, ["|"]);
  const parseAnd = mkBin(parseBOr, ["&&"]);
  function parseOr() { return mkBin(parseAnd, ["||"])(); }

  function parseUnary() {
    const tk = peek();
    if (tk.t === "op" && ["-", "+", "!", "~", "*", "&", "++", "--"].indexOf(tk.v) >= 0) {
      next();
      const e = parseUnary();
      if (tk.v === "++" || tk.v === "--") return { k: "Pre", op: tk.v, target: e, line: tk.line };
      return { k: "Un", op: tk.v, e: e, line: tk.line };
    }
    if (tk.t === "kw" && tk.v === "sizeof") {
      next();
      if (atOp("(") && toks[p + 1].t === "kw" && TYPEWORDS.has(toks[p + 1].v)) {
        next(); const t = parseType(); expect("op", ")");
        return { k: "SizeofT", type: t, line: tk.line };
      }
      const e = parseUnary();
      return { k: "SizeofE", e: e, line: tk.line };
    }
    if (atOp("(") && toks[p + 1].t === "kw" && TYPEWORDS.has(toks[p + 1].v)) {
      const line = next().line; const t = parseType(); expect("op", ")");
      const e = parseUnary();
      return { k: "Cast", type: t, e: e, line: line };
    }
    return parsePostfix();
  }
  function parsePostfix() {
    let e = parsePrimary();
    for (;;) {
      if (atOp("[")) { const line = next().line; const idx = parseExpr(); expect("op", "]"); e = { k: "Index", base: e, idx: idx, line: line }; }
      else if (atOp("(")) {
        const line = next().line; const args = [];
        while (!atOp(")")) { args.push(parseExpr()); if (atOp(",")) next(); else break; }
        expect("op", ")");
        if (e.k !== "Id") throw CErr(line, "That is not a function", "Only a function name can be called with ( ).", "");
        e = { k: "Call", name: e.name, args: args, line: line };
      }
      else if (atOp("++") || atOp("--")) { const t = next(); e = { k: "Post", op: t.v, target: e, line: t.line }; }
      else break;
    }
    return e;
  }

/* ------------------------------------------------------------------ */
/*  3. MEMORY MODEL - real bytes, real addresses                       */
/* ------------------------------------------------------------------ */
const SEG = {
  RODATA: 0x0800, RODATA_END: 0x0900,
  DATA: 0x1000, DATA_END: 0x1400,
  STACK: 0x2000, STACK_END: 0x2400,
  HEAP: 0x3000, HEAP_END: 0x3400
};
function sizeOfType(t) {
  if (t.ptr > 0) return 8;
  switch (t.base) {
    case "char": return 1; case "short": return 2; case "int": return 4;
    case "long": return 8; case "float": return 4; case "double": return 8;
    case "void": return 1; default: return 4;
  }
}

}

function Mem() {
  this.buf = new ArrayBuffer(0x4000);

}
Mem.prototype.write = function (addr, t, val) {
  const s = sizeOfType(t);

  if (t.ptr > 0) { this.dv.setUint32(addr, val >>> 0, true); this.dv.setUint32(addr + 4, 0, true); return; }

    case "char": this.dv.setInt8(addr, (val << 24) >> 24); break;

    case "int": this.dv.setInt32(addr, val | 0, true); break;
    case "long": this.dv.setInt32(addr, val | 0, true); this.dv.setInt32(addr + 4, val < 0 ? -1 : 0, true); break;
    case "float": this.dv.setFloat32(addr, val, true); break;

    case "short": return this.dv.getInt16(addr, true);
    case "int": return this.dv.getInt32(addr, true);
    case "long": return this.dv.getInt32(addr, true);
    case "float": return this.dv.getFloat32(addr, true);
    case "double": return this.dv.getFloat64(addr, true);

  }

Mem.prototype.bytes = function (addr, n) {
  const out = [];
  for (let k = 0; k < n; k++) out.push({ a: addr + k, b: this.u8[addr + k], set: this.written.has(addr + k) });
  return out;
};

/* ------------------------------------------------------------------ */
/*  4. THE VIRTUAL MACHINE                                             */
/* ------------------------------------------------------------------ */
const MAX_STEPS = 2600;
const MAX_DEPTH = 90;

function run(src) {

  const trace = [];

  let dataPtr = SEG.DATA, roPtr = SEG.RODATA, heapPtr = SEG.HEAP;
