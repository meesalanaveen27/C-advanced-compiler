function quizHTML(mod) {
  if (!mod.quiz || !mod.quiz.length) return "";
  return '<div class="quiz">' + mod.quiz.map((q, i) => {
    const key = mod.id + "_" + i;
    const prev = S.quizAns[key];
    const dtag = q.d === "easy" ? "g" : q.d === "medium" ? "a" : "p";
    let body = "";
    const label = { mcq: "Multiple choice", out: "Predict the output", mem: "Memory prediction", fill: "Fill in the blank", order: "Arrange in order" }[q.type] || "Question";
    if (q.type === "fill") {
      body = (q.code ? '<div class="qcode">' + highlight(q.code) + '</div>' : '') +
        '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">' +
        '<input class="fillinput" data-fill="' + key + '" placeholder="type your answer"' + (prev !== undefined ? ' disabled value="' + esc(prev.v || "") + '"' : '') + '>' +
        '<button class="btn sm" data-check="' + key + '"' + (prev !== undefined ? " disabled" : "") + '>Check</button></div>';
    } else if (q.type === "order") {
      const order = prev ? prev.order : shuffled(q.items);
      body = '<div class="orderlist" data-order="' + key + '">' + order.map(t =>
        '<div class="orderitem" draggable="' + (prev === undefined) + '" data-t="' + esc(t) + '"><span class="grip">⠿</span>' + esc(t) + '</div>').join("") + '</div>' +
        '<button class="btn sm" style="margin-top:11px" data-check="' + key + '"' + (prev !== undefined ? " disabled" : "") + '>Check order</button>';
    } else {
      body = (q.code ? '<div class="qcode">' + highlight(q.code) + '</div>' : '') +
        '<div class="opts">' + q.opts.map((o, oi) => {
          let cls = "opt";
          if (prev !== undefined) {
            cls += " dis";
            if (oi === q.a) cls += " right";
            else if (oi === prev.pick) cls += " wrong";
          }
          return '<button class="' + cls + '" data-q="' + key + '" data-o="' + oi + '"' + (prev !== undefined ? " disabled" : "") + '>' +
            '<span class="ol">' + "ABCD"[oi] + '</span>' + esc(o) + '</button>';
        }).join("") + '</div>';
    }
    const ok = prev && prev.ok;
    return '<div class="qcard" data-qcard="' + key + '">' +
      '<div class="qmeta"><span class="tag ' + dtag + '">' + q.d + '</span><span class="tag v">' + label + '</span>' +
      '<span style="margin-left:auto;font-size:11.5px;color:var(--txt3)">Q' + (i + 1) + ' of ' + mod.quiz.length + '</span></div>' +
      '<div class="qq">' + esc(q.q) + '</div>' + body +
      (prev !== undefined ? '<div class="expl"><b>' + (ok ? "✓ Correct. " : "Not quite. ") + '</b>' + esc(q.why) + '</div>' : '<div data-expl="' + key + '"></div>') +
      '</div>';
  }).join("") + '</div>';
}
function shuffled(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; } return b.join("|") === a.join("|") ? b.reverse() : b; }

function quizAnswer(key, ok, payload, why) {
  S.quizAns[key] = Object.assign({ ok: ok }, payload);
  if (ok) { S.correct++; addXP(15, "correct answer"); }
  else addXP(4, "good attempt — read the explanation");
  save(); checkBadges();
  const card = $('[data-qcard="' + key + '"]');
  if (!card) return;
  const slot = $('[data-expl="' + key + '"]', card);
  if (slot) slot.outerHTML = '<div class="expl"><b>' + (ok ? "✓ Correct. " : "Not quite. ") + '</b>' + esc(why) + '</div>';
  $$("button,input", card).forEach(b => b.disabled = true);
  // module completion
  const mid = +key.split("_")[0];
  const mod = COURSE.filter(m => m.id === mid)[0];
  if (mod && mod.quiz.length) {
    const answered = mod.quiz.filter((_, i) => S.quizAns[mid + "_" + i] !== undefined).length;
    if (answered === mod.quiz.length && !S.done[mid]) {
      S.done[mid] = true; save(); checkBadges();
      addXP(45, "module complete");
      const allRight = mod.quiz.every((_, i) => S.quizAns[mid + "_" + i].ok);
      if (allRight) award("perfect");
      toast("✅", "Module complete: " + mod.title, "Unlocked the next module on your roadmap.");
      confetti();
    }
  }
}
document.addEventListener("click", function (e) {
  const o = e.target.closest("[data-q]");
  if (o) {
    const key = o.getAttribute("data-q"), pick = +o.getAttribute("data-o");
    const [mid, qi] = key.split("_").map(Number);
    const q = COURSE.filter(m => m.id === mid)[0].quiz[qi];
    const ok = pick === q.a;
    $$('[data-q="' + key + '"]').forEach((b, i) => {
      b.classList.add("dis");
      if (i === q.a) b.classList.add("right");
      else if (i === pick) b.classList.add("wrong");
    });
    quizAnswer(key, ok, { pick: pick }, q.why);
    return;
  }
  const ch = e.target.closest("[data-check]");
  if (ch) {
    const key = ch.getAttribute("data-check");
    const [mid, qi] = key.split("_").map(Number);
    const q = COURSE.filter(m => m.id === mid)[0].quiz[qi];
    if (q.type === "fill") {
      const inp = $('[data-fill="' + key + '"]');
      const v = (inp.value || "").trim().toLowerCase();
      const ok = q.answer.some(a => String(a).trim().toLowerCase() === v);
      inp.style.borderColor = ok ? "var(--green)" : "var(--red)";
      quizAnswer(key, ok, { v: inp.value }, q.why + (ok ? "" : "  (Accepted answer: " + q.answer[0] + ")"));
    } else if (q.type === "order") {
      const list = $('[data-order="' + key + '"]');
      const got = $$(".orderitem", list).map(x => x.getAttribute("data-t"));
      const ok = got.join("|") === q.items.join("|");
      $$(".orderitem", list).forEach((x, i) => {
        x.style.borderColor = x.getAttribute("data-t") === q.items[i] ? "rgba(52,211,153,.5)" : "rgba(251,113,133,.5)";
        x.setAttribute("draggable", "false");
      });
      quizAnswer(key, ok, { order: got }, q.why + (ok ? "" : "  Correct order: " + q.items.join(" → ")));
    }
  }
});
/* drag to reorder */
let dragEl = null;
document.addEventListener("dragstart", e => { const t = e.target.closest(".orderitem"); if (t) { dragEl = t; t.classList.add("dragging"); } });
document.addEventListener("dragend", e => { if (dragEl) dragEl.classList.remove("dragging"); dragEl = null; });
document.addEventListener("dragover", e => {
  const t = e.target.closest(".orderitem");
  if (!t || !dragEl || t === dragEl || t.parentNode !== dragEl.parentNode) return;
  e.preventDefault();
  const r = t.getBoundingClientRect();
  t.parentNode.insertBefore(dragEl, (e.clientY - r.top) / r.height > .5 ? t.nextSibling : t);
});

function typer() {

    { t: "int main() {", c: "" },
    { t: "    int a = 6;", c: "" },
    { t: "    int b = 7;", c: "" },
    { t: "    printf(\"%d\\n\", a * b);", c: "" },
    { t: "    return 0;", c: "" },
    { t: "}", c: "" }, { t: "", c: "" },
    { t: "> 42", c: "k-str" },
    { t: "> and you watched every byte of it", c: "k-cm" }
  ];
  let li = 0, ci = 0, html = "";
  (function tick() {
    if (li >= lines.length) { el.innerHTML = lines.map(l => '<div class="' + l.c + '">' + (l.c ? esc(l.t) : highlight(l.t)) + "</div>").join("") ; return; }
    const line = lines[li];

    } else {
      html += '<div class="' + line.c + '">' + (line.c ? esc(line.t) : highlight(line.t)) + "</div>";

  })();
}

function tutorAnswer(q) {
  const s = q.toLowerCase();
  let best = null, bestScore = 0;
  TUTOR.forEach(t => {
    t.k.forEach(k => {
      const words = k.split(" ").filter(w => w.length > 2);
      const hits = words.filter(w => s.indexOf(w) >= 0).length;
      const score = hits / Math.max(1, words.length) + (s.indexOf(k) >= 0 ? 1.4 : 0);
      if (score > bestScore && hits > 0) { bestScore = score; best = t; }
    });
  });
  if (best && bestScore >= 0.55) return best.a;
  const m = COURSE.filter(mm => s.indexOf(mm.title.toLowerCase()) >= 0)[0];
  if (m) return "That is **Module " + m.id + " · " + m.title + "**.\n\n" + (typeof m.story[1] === "object" ? m.story[1].big : m.story[0]) +
    "\n\nOpen the module and press **Run** — the visualisers will show you far more than I can say in a paragraph.";
  return "I do not have a prepared answer for that one yet. Try asking me about:\n\n• what a pointer is\n• stack vs heap\n• why 7/2 is 3\n• what a stack frame is\n• compiler vs interpreter\n• memory leaks\n• why arrays start at 0\n\nOr open the module and use the step buttons — watching it beats reading about it.";
}
function mdlite(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>").replace(/\n/g, "<br>");
}
function tutorSend(q) {
  const box = $("#tmsgs");
  box.insertAdjacentHTML("beforeend", '<div class="msg me">' + esc(q) + "</div>");
  box.scrollTop = box.scrollHeight;
  setTimeout(() => {
    box.insertAdjacentHTML("beforeend", '<div class="msg bot">' + mdlite(tutorAnswer(q)) + "</div>");
    box.scrollTop = box.scrollHeight;
  }, 320);
}

document.addEventListener("click", function (e) {
  const g = e.target.closest("[data-go]");
  if (g) {
    const v = g.getAttribute("data-go"), mod = +(g.getAttribute("data-mod") || 0);
    if (mod) go("lesson", mod); else go(v);
    return;
  }
  const o = e.target.closest("[data-open]");
  if (o) {
    const id = +o.getAttribute("data-open");
    if (!unlocked(id)) { toast("🔒", "Locked", "Finish the practice questions in module " + (id - 1) + " — or turn on “Unlock every module” in Your progress → Settings."); return; }
    go("lesson", id, o.getAttribute("data-tab2") || "story");
    return;
  }
  const t = e.target.closest("[data-tab]");
  if (t) { S.tab = t.getAttribute("data-tab"); render(); return; }
  const s = e.target.closest("[data-sample]");
  if (s) {
    const m = COURSE.filter(x => x.id === +s.getAttribute("data-sample"))[0];
    store.set("labcode", m.demo.code); go("lab"); return;
  }
  const p = e.target.closest("[data-project]");
  if (p) { S.project = p.getAttribute("data-project") || null; render(); return; }
  const a = e.target.closest("[data-act]");
  if (a) {
    const act = a.getAttribute("data-act");
    if (act === "theme") toggleTheme();
    if (act === "voice") { S.voice = !S.voice; save(); if (!S.voice) try { speechSynthesis.cancel(); } catch (er) { } render(); }
    if (act === "roam") { S.freeRoam = !S.freeRoam; save(); toast(S.freeRoam ? "🔓" : "🔒", S.freeRoam ? "All modules unlocked" : "Back to the guided path", S.freeRoam ? "Jump anywhere you like — progress is still tracked." : "Modules unlock one at a time again."); render(); }
    if (act === "name") { const n = prompt("Name to print on your certificate:", store.get("name", "")); if (n) { store.set("name", n); render(); } }
    if (act === "reset") { if (confirm("Erase all progress, XP and badges?")) { try { Object.keys(localStorage).filter(k => k.indexOf("cuniv_") === 0).forEach(k => localStorage.removeItem(k)); } catch (er) { } location.reload(); } }
  }
});
function toggleTheme() {
  S.theme = S.theme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", S.theme);
  $("#themebtn").innerHTML = S.theme === "dark" ? I.moon : I.sun;
  save();
}

/* keyboard */
document.addEventListener("keydown", function (e) {
  if (/input|textarea/i.test((e.target.tagName || ""))) return;
  const k = e.key.toLowerCase();
  if (k === "r" && CURLAB) { e.preventDefault(); CURLAB.run(); }
  else if (k === " " && CURLAB) { e.preventDefault(); CURLAB.togglePlay(); }
  else if (e.key === "ArrowRight" && CURLAB) { e.preventDefault(); CURLAB.step(1); }
  else if (e.key === "ArrowLeft" && CURLAB) { e.preventDefault(); CURLAB.step(-1); }
  else if (k === "t") { $("#tpanel").classList.toggle("open"); }
  else if (k === "l") toggleTheme();
  else if (k === "escape") $("#tpanel").classList.remove("open");
});

/* particles */
function particles() {
  const c = $("#particles"), ctx = c.getContext("2d");
  let W, H, P = [];
  function size() {
    W = c.width = innerWidth; H = c.height = innerHeight;
    P = [];
    const n = Math.min(90, Math.round(W * H / 22000));
    for (let i = 0; i < n; i++) P.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .28, vy: (Math.random() - .5) * .28,
      r: Math.random() * 1.6 + .5, a: Math.random() * .5 + .15
    });
  }
  size(); addEventListener("resize", size);
  (function loop() {
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7);
      ctx.fillStyle = "rgba(150,200,255," + p.a + ")"; ctx.fill();
      for (let j = i + 1; j < P.length; j++) {
        const q = P[j], dx = p.x - q.x, dy = p.y - q.y, d = dx * dx + dy * dy;
        if (d < 15000) {
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = "rgba(120,180,255," + (0.09 * (1 - d / 15000)) + ")";
          ctx.lineWidth = .7; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(loop);
  })();
}

/* boot */
function boot() {
  document.documentElement.setAttribute("data-theme", S.theme);
  $("#rail").innerHTML = '<div class="logo" data-go="home">C</div>' +
    NAV.map(n => '<button class="railbtn" data-go="' + n[0] + '" data-tip="' + n[2] + '">' + n[1] + '</button>').join("") +
    '<div class="spacer"></div>';
  $("#themebtn").innerHTML = S.theme === "dark" ? I.moon : I.sun;
  checkStreak(); checkBadges();
  particles();
  render();
  $("#tbtn").addEventListener("click", () => $("#tpanel").classList.toggle("open"));
  $("#tsend").addEventListener("click", () => { const i = $("#tinput"); if (i.value.trim()) { tutorSend(i.value.trim()); i.value = ""; } });
  $("#tinput").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.value.trim()) { tutorSend(e.target.value.trim()); e.target.value = ""; } });
  $("#tsug").addEventListener("click", e => { const b = e.target.closest("button"); if (b) tutorSend(b.textContent); });
  addEventListener("resize", () => { if (CURLAB && CURLAB.vtab === "mem") CURLAB.drawArrows(); });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
