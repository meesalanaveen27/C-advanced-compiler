    if (name === "printf") {
      const r = doPrintf(n);
      step({
        line: n.line, kind: "print", title: "printf -> screen",
        why: "The CPU hands the finished text to the operating system, which paints it on your screen. This is the only moment the outside world sees anything your program did.",
        asm: ["LEA  R0, [fmt]", "CALL printf", "SYSCALL write(1)"], cpu: "io"
      });
      return r;
    }
    if (name === "malloc") {
      const sz = Math.trunc(evalExpr(n.args[0]).v);
      heapPtr = Math.ceil(heapPtr / 8) * 8;
      const addr = heapPtr; heapPtr += sz;
      if (heapPtr > SEG.HEAP_END) throw CErr(n.line, "Out of heap memory",
        "malloc could not find " + sz + " free bytes. In a real program malloc returns NULL when memory runs out.",
        "Always check:  if (p == NULL) { /* handle it */ }  - and free() what you no longer need.");
      heapBlocks.push({ addr: addr, size: sz, freed: false });
      step({
        line: n.line, kind: "malloc", title: "malloc(" + sz + ") -> " + hex(addr),
        why: "You asked the operating system for " + sz + " bytes of fresh memory from the HEAP. The heap is the big open field of memory you control by hand. malloc returns the address of the first byte: " + hex(addr) + ". Nobody will clean this up for you - you must call free().",
        asm: ["MOV  R0, #" + sz, "CALL malloc", "MOV  R1, " + hex(addr)], cpu: "memory", hi: [addr]
      });
      return { v: addr, t: { base: "void", ptr: 1 } };
    }
    if (name === "calloc") {
      const cnt = Math.trunc(evalExpr(n.args[0]).v), sz1 = Math.trunc(evalExpr(n.args[1]).v);
      const sz = cnt * sz1;
      heapPtr = Math.ceil(heapPtr / 8) * 8;
      const addr = heapPtr; heapPtr += sz;
      for (let k = 0; k < sz; k++) { mem.u8[addr + k] = 0; mem.written.add(addr + k); }
      heapBlocks.push({ addr: addr, size: sz, freed: false });
      step({
        line: n.line, kind: "malloc", title: "calloc(" + cnt + ", " + sz1 + ") -> " + hex(addr),
        why: "calloc is malloc's tidy cousin: it reserves " + sz + " bytes AND wipes every one of them to zero first.",
        asm: ["MOV  R0, #" + sz, "CALL calloc"], cpu: "memory", hi: [addr]
      });
      return { v: addr, t: { base: "void", ptr: 1 } };
    }
    if (name === "free") {
      const a = evalExpr(n.args[0]).v;
      const blk = heapBlocks.filter(function (b) { return b.addr === a; })[0];
      if (!blk) throw CErr(n.line, "free() on memory you do not own",
        "You called free(" + hex(a) + ") but malloc never gave you that address.",
        "Only free a pointer that came straight from malloc / calloc, and only once.");
      if (blk.freed) throw CErr(n.line, "Double free",
        "This heap block was already freed. Freeing twice corrupts the memory manager and crashes real programs.",
        "Set the pointer to NULL right after freeing:  free(p); p = NULL;");
      blk.freed = true;
      step({
        line: n.line, kind: "free", title: "free(" + hex(a) + ")",
        why: "You handed the block at " + hex(a) + " back to the operating system. The bytes may still contain the old numbers, but they no longer belong to you - touching them now is a dangling pointer bug.",
        asm: ["MOV  R0, " + hex(a), "CALL free"], cpu: "memory", hi: [a]
      });
      return { v: 0, t: T_INT };
    }
    if (name === "strlen") { const a = evalExpr(n.args[0]); return { v: (a.str !== undefined ? a.str : readCString(a.v)).length, t: T_INT }; }
    if (name === "abs") return { v: Math.abs(evalExpr(n.args[0]).v), t: T_INT };
    if (name === "sqrt") return { v: Math.sqrt(evalExpr(n.args[0]).v), t: T_DBL };
    if (name === "pow") return { v: Math.pow(evalExpr(n.args[0]).v, evalExpr(n.args[1]).v), t: T_DBL };
    if (name === "scanf" || name === "getchar") return { v: 0, t: T_INT };

    const f = funcs[name];
    if (!f) throw CErr(n.line, "Unknown function `" + name + "`",
      "There is no function called `" + name + "` in this program, and it is not one of the built-ins (printf, malloc, calloc, free, strlen, abs, sqrt, pow).",
      "Define it above main:  int " + name + "() { ... }   - or check the spelling.");
    if (frames.length >= MAX_DEPTH) throw CErr(n.line, "Too many nested calls (stack overflow)",
      "Function calls stack on top of each other. You reached " + MAX_DEPTH + " frames deep, which almost always means recursion with no stopping point.",
      "Every recursive function needs a base case:  if (n <= 1) return 1;");

    const argVals = n.args.map(evalExpr);
    const savedSP = stackPtr;
    const fr = {
      id: ++frameSeq, fn: name, callLine: n.line,
      scopes: [new Map()], vars: [], base: stackPtr, savedSP: savedSP,
      depth: frames.length, argText: ""
    };
    frames.push(fr);
    const parts = [];
    f.params.forEach(function (prm, i) {
      const v = allocLocal(prm.name, prm.type, 1, n.line);
      const av = argVals[i] ? argVals[i].v : 0;
      mem.write(v.addr, prm.type, isFloatType(prm.type) ? av : Math.trunc(av));
      parts.push(prm.name + "=" + fmtVal(av, prm.type));
    });
    fr.argText = parts.join(", ");
    step({
      line: f.line, kind: "call", title: "CALL " + name + "(" + fr.argText + ")",
      why: "A new STACK FRAME is pushed. Think of it as a fresh clean desk just for this call: it holds the parameters (" +
        (fr.argText || "none") + "), any local variables, and the return address so the CPU knows where to come back to (line " + n.line + "). Every call gets its own desk - that is exactly why recursion works.",
      asm: f.params.map(function (prm, i) { return "PUSH " + fmtVal(argVals[i] ? argVals[i].v : 0, prm.type); })
        .concat(["CALL " + name, "PUSH BP", "MOV  BP, SP"]),
      cpu: "stack", hi: fr.vars.map(function (v) { return v.addr; })
    });

    let ret = { v: 0, t: f.ret };
    try { execStmt(f.body); }
    catch (e) {
      if (e && e.__ret) ret = { v: e.value, t: f.ret };
      else { frames.pop(); stackPtr = savedSP; throw e; }
    }
    if (!isFloatType(f.ret) && f.ret.ptr === 0) ret.v = Math.trunc(ret.v || 0);
    const localNames = fr.vars.map(function (v) { return v.name; }).join(", ");
    frames.pop();
    stackPtr = savedSP;
    step({
      line: n.line, kind: "ret", title: "RETURN " + fmtVal(ret.v, f.ret) + " from " + name,
      why: name + " is finished. Its stack frame is popped - the desk is wiped clean and the memory (" +
        (localNames || "no locals") + ") is handed back instantly. The answer " + fmtVal(ret.v, f.ret) +
        " travels back inside a CPU register, and execution jumps to line " + n.line + " where the call was made.",
      asm: ["MOV  R0, " + fmtVal(ret.v, f.ret), "MOV  SP, BP", "POP  BP", "RET"],
      cpu: "stack"
    });
    return ret;
  }
  function fmtVal(v, t) {
    if (!t) return String(v);
    if (isFloatType(t)) return Number(v).toFixed(2);
    if (t.ptr > 0) return hex(v);
    if (t.base === "char") return "'" + String.fromCharCode(v & 255) + "'";
    return String(Math.trunc(v));
  }

  function execStmt(s) {
    if (halted) return;
    switch (s.k) {
      case "Block": {
        const fr = frames[frames.length - 1];
        if (fr) fr.scopes.push(new Map());
        try { for (let i = 0; i < s.stmts.length; i++) execStmt(s.stmts[i]); }
        finally { if (fr) fr.scopes.pop(); }
        return;
      }
      case "Empty": return;
      case "Decl": {
        for (let ii = 0; ii < s.items.length; ii++) {
          const it = s.items[ii];
          let count = 1, isArr = false;
          if (it.arrLen) {
            isArr = true;
            count = it.arrLen.k === "Auto"
              ? (it.arrInit ? it.arrInit.length : (it.init && it.init.k === "Str" ? it.init.v.length + 1 : 1))
              : Math.trunc(evalExpr(it.arrLen).v);
            if (count <= 0) throw CErr(s.line, "Array size must be positive",
              "You asked for an array of " + count + " items.", "Use a size of at least 1, e.g. int a[5];");
          }
          const v = frames.length ? allocLocal(it.name, it.type, count, s.line)
            : allocGlobal(it.name, it.type, count);
          v.isArray = isArr;
          const one = sizeOfType(it.type);
          let why, asm = [];
          if (isArr) {
            if (it.arrInit) it.arrInit.forEach(function (e, i) { if (i < count) mem.write(v.addr + i * one, it.type, evalExpr(e).v); });
            else if (it.init && it.init.k === "Str") {
              const str = it.init.v;
              for (let i = 0; i < count; i++) mem.write(v.addr + i * one, it.type, i < str.length ? str.charCodeAt(i) : 0);
            }
            why = "An ARRAY is one long row of identical boxes, side by side, with no gaps between them. `" + it.name + "` reserves " +
              count + " x " + one + " = " + v.size + " bytes starting at " + hex(v.addr) +
              ". Slot 0 lives at " + hex(v.addr) + ", slot 1 at " + hex(v.addr + one) +
              " - and that is exactly why the computer can jump to slot i instantly: address = start + i x " + one + ".";
            asm = ["SUB  SP, #" + v.size, "LEA  R0, [" + hex(v.addr) + "]"];
          } else if (it.init) {
            const r = evalExpr(it.init);
            let val = r.v;
            if (!isFloatType(it.type)) val = Math.trunc(val);
            mem.write(v.addr, it.type, val);
            setRegs(undefined, undefined, val);
            if (it.type.ptr > 0) {
              let target = null;
              for (let q = 0; q < symbols.length; q++) if (symbols[q].addr === val) { target = symbols[q]; break; }
              why = "`" + it.name + "` is a POINTER. It does not hold a number you care about - it holds an ADDRESS. " +
                "It is " + sizeOfType(it.type) + " bytes wide (big enough to name any byte in memory) and it now stores " + hex(val) +
                (target ? ", which is exactly where `" + target.name + "` lives. So `" + it.name + "` now points at `" + target.name + "`." : ".");
              asm = ["LEA  R0, [" + hex(val) + "]", "STORE R0, [" + hex(v.addr) + "]"];
            } else {
              why = "The compiler reserved " + one + " byte" + (one > 1 ? "s" : "") + " of memory at address " + hex(v.addr) +
                " and wrote `" + it.name + "` on the label. Then the value " + fmtVal(val, it.type) +
                " was placed inside those bytes. From now on, whenever you type `" + it.name + "`, the CPU really means \"the " +
                one + " bytes living at " + hex(v.addr) + "\".";
              asm = ["MOV  R0, #" + fmtVal(val, it.type), "STORE R0, [" + hex(v.addr) + "]"];
            }
          } else {
            why = "Room for `" + it.name + "` was reserved at " + hex(v.addr) + " - " + one + " bytes - but nothing was written into it yet. " +
              "In C those bytes still hold whatever the last program left behind. That is an uninitialised variable, and it is one of the classic C bugs.";
            asm = ["SUB  SP, #" + one];
          }
          step({
            line: s.line, kind: "decl",
            title: typeName(it.type) + " " + it.name + (isArr ? "[" + count + "]" : "") + " @ " + hex(v.addr),
            why: why, asm: asm, cpu: "memory", hi: [v.addr], hiName: it.name
          });
        }
        return;
      }
      case "ExprStmt": {
        const e = s.expr;
        if (e.k === "Call") { evalExpr(e); return; }
        const r = evalExpr(e);
        if (e.k === "Assign" || e.k === "Post" || e.k === "Pre") {
          const nm = describeTarget(e.target || e.e);
          step({
            line: s.line, kind: "assign", title: nm + " = " + fmtVal(r.v, r.t),
            why: "The right-hand side is worked out first, giving " + fmtVal(r.v, r.t) +
              ". Then those bytes are overwritten at address " + hex(r.addr !== undefined ? r.addr : 0) +
              ". The old value is gone forever - memory has no undo button.",
            asm: ["MOV  R0, #" + fmtVal(r.v, r.t), "STORE R0, [" + hex(r.addr || 0) + "]"],
            cpu: "memory", hi: [r.addr], hiName: nm
          });
        }
        return;
      }
      case "If": {
        const c = evalExpr(s.cond);
        step({
          line: s.line, kind: "cond", title: "if ( " + srcOf(s.cond) + " ) -> " + (c.v ? "TRUE" : "FALSE"),
          why: "The ALU compared the two values and set a flag inside the CPU. The result is " + (c.v ? "TRUE (not zero)" : "FALSE (zero)") +
            ", so the program " + (c.v ? "walks into the if-block." : (s.els ? "skips the if-block and runs the else-block instead." : "skips the whole if-block.")),
          asm: ["CMP  R0, R1", c.v ? "JNE  .then" : "JE   .else"], cpu: "alu", cond: !!c.v
        });
        if (c.v) execStmt(s.then); else if (s.els) execStmt(s.els);
        return;
      }
      case "While": {
        let iter = 0;
        for (;;) {
          const c = evalExpr(s.cond);
          step({
            line: s.line, kind: "loopcheck", title: "while ( " + srcOf(s.cond) + " ) -> " + (c.v ? "TRUE" : "FALSE"),
            why: c.v ? "The condition is still true, so the body runs again. This is pass number " + (iter + 1) + "."
              : "The condition finally became false after " + iter + " pass" + (iter === 1 ? "" : "es") + ". The loop ends and the program moves on to whatever comes next.",
            asm: ["CMP  R0, R1", c.v ? "JL   .body" : "JMP  .end"], cpu: "alu", cond: !!c.v,
            loop: { kind: "while", iter: iter + 1, running: !!c.v }
          });
          if (!c.v) break;
          iter++;
          try { execStmt(s.body); }
          catch (e) { if (e && e.__break) break; else if (e && e.__cont) { } else throw e; }
        }
        return;
      }
      case "DoWhile": {
        let iter = 0;
        for (;;) {
          iter++;
          try { execStmt(s.body); }
          catch (e) { if (e && e.__break) break; else if (e && e.__cont) { } else throw e; }
          const c = evalExpr(s.cond);
          step({
            line: s.line, kind: "loopcheck", title: "} while ( " + srcOf(s.cond) + " ) -> " + (c.v ? "TRUE" : "FALSE"),
            why: "A do-while checks the condition AFTER running the body, which is why the body always runs at least once. Pass " + iter +
              " has finished and the condition is " + (c.v ? "true, so around we go again." : "false, so the loop ends."),
            asm: ["CMP  R0, R1", c.v ? "JL   .body" : "JMP  .end"], cpu: "alu", cond: !!c.v,
            loop: { kind: "do", iter: iter, running: !!c.v }
          });
          if (!c.v) break;
        }
        return;
      }
      case "For": {
        const fr = frames[frames.length - 1];
        if (fr) fr.scopes.push(new Map());
        try {
          if (s.init) execStmt(s.init);
          let iter = 0;
          for (;;) {
            const c = s.cond ? evalExpr(s.cond) : { v: 1 };
            step({
              line: s.line, kind: "loopcheck",
              title: "for ( ... ; " + (s.cond ? srcOf(s.cond) : "always") + " ; ... ) -> " + (c.v ? "TRUE" : "FALSE"),
              why: c.v
                ? "Check the condition - it is TRUE, so the body runs. This is iteration " + (iter + 1) + ". A for-loop is really just three things bolted together: set up once, check every time, change every time."
                : "The condition is now FALSE after " + iter + " iteration" + (iter === 1 ? "" : "s") + ", so the loop stops and the program continues below it.",
              asm: ["CMP  R0, R1", c.v ? "JL   .body" : "JMP  .end"], cpu: "alu", cond: !!c.v,
              loop: { kind: "for", iter: iter + 1, running: !!c.v }
            });
            if (!c.v) break;
            iter++;
            let broke = false;
            try { execStmt(s.body); }
            catch (e) { if (e && e.__break) { broke = true; } else if (!(e && e.__cont)) throw e; }
            if (broke) break;
            if (s.step) {
              const r = evalExpr(s.step);
              step({
                line: s.line, kind: "loopstep", title: "update: " + srcOf(s.step),
                why: "End of the body - now the update part runs and the counter changes. Without this line the counter would never move and the loop would spin forever.",
                asm: ["ADD  R0, #1", "STORE R0, [" + hex(r.addr || 0) + "]"], cpu: "alu",
                hi: [r.addr], loop: { kind: "for", iter: iter, running: true }
              });
            }
          }
        } finally { if (fr) fr.scopes.pop(); }
        return;
      }
      case "Return": {
        const v = s.expr ? evalExpr(s.expr).v : 0;
        const e = new Error("return"); e.__ret = true; e.value = v; throw e;
      }
      case "Break": { const e = new Error("break"); e.__break = true; throw e; }
      case "Continue": { const e = new Error("continue"); e.__cont = true; throw e; }
      default: return;
    }
  }
  function describeTarget(t) {
    if (!t) return "value";
    if (t.k === "Id") return t.name;
    if (t.k === "Index") return srcOf(t);
    if (t.k === "Un" && t.op === "*") return "*" + srcOf(t.e);
    return srcOf(t);
  }

  let error = null, exitCode = 0;
  try {
    step({
      line: 0, kind: "start", title: "Program loaded into memory",
      why: "The operating system has copied your executable into RAM, marked out the three regions (code, stack, heap), pointed the Program Counter at the first instruction of main(), and let go. From here the CPU runs on its own, one instruction at a time, billions per second.",
      asm: ["; loader: map segments", "JMP  main"], cpu: "load"
    });
    for (let g = 0; g < ast.globals.length; g++) execStmt(ast.globals[g]);
    if (!funcs.main) throw CErr(1, "No main() function",
      "Every C program starts at a function called main. I could not find one.",
      "Add:  int main() { ... return 0; }");
    const fr = { id: ++frameSeq, fn: "main", callLine: 0, scopes: [new Map()], vars: [], base: stackPtr, savedSP: stackPtr, depth: 0, argText: "" };
    frames.push(fr);
    step({
      line: funcs.main.line, kind: "call", title: "CALL main()",
      why: "Execution begins here. main() gets the very first stack frame - the bottom desk of the whole pile.",
      asm: ["CALL main", "PUSH BP", "MOV  BP, SP"], cpu: "stack"
    });
    try { execStmt(funcs.main.body); }
    catch (e) { if (e && e.__ret) exitCode = Math.trunc(e.value || 0); else throw e; }
    step({
      line: funcs.main.line, kind: "end", title: "Program finished - exit code " + exitCode,
      why: "main() returned " + exitCode + ". This is the final state of memory before the operating system takes every byte of the stack and heap back and closes the program. 0 traditionally means \"everything went fine\".",
      asm: ["MOV  R0, #" + exitCode, "CALL exit"], cpu: "load"
    });
    frames.pop();
  } catch (e) {
    if (e && e.isCErr) {
      error = { line: e.line, title: e.title, msg: e.msg, hint: e.hint, phase: e.phase || "runtime" };
      step({ line: e.line, kind: "error", title: "x " + e.title, why: e.msg, asm: ["; execution halted"], cpu: "error" });
    } else if (e && (e.__ret || e.__break || e.__cont)) { /* stray control flow */ }
    else throw e;
  }

  return {
    ok: !error, error: error, trace: trace, output: out.join(""),
    tokens: toks, ast: ast, symbols: symbols, exitCode: exitCode, steps: trace.length
  };
}

/* ------------------------------------------------------------------ */
/*  5. SOURCE RECONSTRUCTION                                           */
/* ------------------------------------------------------------------ */
function srcOf(n) {
  if (!n) return "";
  switch (n.k) {
    case "Num": return String(n.v);
    case "Char": return "'" + String.fromCharCode(n.v) + "'";
    case "Str": return '"' + n.v + '"';
    case "Id": return n.name;
    case "Bin": return srcOf(n.l) + " " + n.op + " " + srcOf(n.r);
    case "Un": return n.op + srcOf(n.e);
    case "Pre": return n.op + srcOf(n.target);
    case "Post": return srcOf(n.target) + n.op;
    case "Assign": return srcOf(n.target) + " " + n.op + " " + srcOf(n.value);
    case "Index": return srcOf(n.base) + "[" + srcOf(n.idx) + "]";
    case "Call": return n.name + "(" + n.args.map(srcOf).join(", ") + ")";
    case "Cond": return srcOf(n.cond) + " ? " + srcOf(n.a) + " : " + srcOf(n.b);
    case "Cast": return "(" + typeName(n.type) + ")" + srcOf(n.e);
    case "SizeofT": return "sizeof(" + typeName(n.type) + ")";
    case "SizeofE": return "sizeof(" + srcOf(n.e) + ")";
    default: return "...";
  }
}

/* ------------------------------------------------------------------ */
/*  6. PSEUDOCODE                                                      */
/* ------------------------------------------------------------------ */
function pseudo(ast) {
  const L = [];
  const ind = function (d) { return Array(d + 1).join("   "); };
  const capital = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
  function expr(n) {
    if (!n) return "";
    switch (n.k) {
      case "Num": return String(n.v);
      case "Char": return "the character '" + String.fromCharCode(n.v) + "'";
      case "Str": return '"' + n.v + '"';
      case "Id": return n.name;
      case "Bin": {
        const w = { "+": "plus", "-": "minus", "*": "times", "/": "divided by", "%": "remainder after dividing by",
          "<": "is less than", ">": "is greater than", "<=": "is at most", ">=": "is at least",
          "==": "is equal to", "!=": "is not equal to", "&&": "AND", "||": "OR" }[n.op] || n.op;
        return expr(n.l) + " " + w + " " + expr(n.r);
      }
      case "Un": return n.op === "&" ? "the address of " + expr(n.e) : n.op === "*" ? "the value stored at " + expr(n.e) : n.op + expr(n.e);
      case "Post": case "Pre": return expr(n.target) + (n.op === "++" ? " increased by 1" : " decreased by 1");
      case "Assign": return "put " + expr(n.value) + " into " + expr(n.target);
      case "Index": return "slot " + expr(n.idx) + " of " + expr(n.base);
      case "Call": return "the result of " + n.name + " with (" + n.args.map(expr).join(", ") + ")";
      default: return srcOf(n);
    }
  }
  function stmt(s, d) {
    if (!s) return;
    switch (s.k) {
      case "Block": s.stmts.forEach(function (x) { stmt(x, d); }); break;
      case "Decl":
        s.items.forEach(function (it) {
          if (it.arrLen) L.push(ind(d) + "Make a row of boxes called " + it.name + " that each hold a " + typeName(it.type));
          else if (it.type.ptr) L.push(ind(d) + "Make a pointer called " + it.name + (it.init ? " and aim it at " + expr(it.init) : ""));
          else L.push(ind(d) + "Make a box called " + it.name + " that holds a " + typeName(it.type) + (it.init ? ", and put " + expr(it.init) + " in it" : ""));
        });
        break;
      case "ExprStmt":
        if (s.expr.k === "Call" && s.expr.name === "printf") L.push(ind(d) + "Show on the screen: " + (s.expr.args[0] ? srcOf(s.expr.args[0]) : ""));
        else L.push(ind(d) + capital(expr(s.expr)));
        break;
      case "If":
        L.push(ind(d) + "If " + expr(s.cond) + ", then:");
        stmt(s.then, d + 1);
        if (s.els) { L.push(ind(d) + "Otherwise:"); stmt(s.els, d + 1); }
        break;

      case "For":

}

/* ------------------------------------------------------------------ */
/*  7. FLOWCHART                                                       */
/* ------------------------------------------------------------------ */
function flowchart(ast) {
  const nodes = [];
  let curLine = 0;
  const add = function (type, text, depth) { nodes.push({ type: type, text: text, depth: depth || 0, line: curLine }); };
  function stmt(s, d) {
    if (!s) return;
    curLine = s.line || curLine;

      case "Block": s.stmts.forEach(function (x) { stmt(x, d); }); break;
      case "Decl": s.items.forEach(function (it) {

      case "If":
        add("dec", srcOf(s.cond) + " ?", d);
        add("branch", "YES", d + 1); stmt(s.then, d + 1);
        if (s.els) { add("branch", "NO", d + 1); stmt(s.els, d + 1); }
        add("merge", "join back", d);
        break;
      case "While": add("loop", "while " + srcOf(s.cond), d); stmt(s.body, d + 1); add("back", "back to the check", d); break;
      case "DoWhile": add("loop", "do (at least once)", d); stmt(s.body, d + 1); add("dec", srcOf(s.cond) + " ?", d); break;
      case "For":
        add("io", "start: " + (s.init ? (s.init.k === "Decl" ? s.init.items.map(function (i) { return i.name + " = " + srcOf(i.init); }).join(", ") : srcOf(s.init.expr)) : "-"), d);
        add("loop", "while " + (s.cond ? srcOf(s.cond) : "true"), d);
        stmt(s.body, d + 1);
        if (s.step) add("proc", srcOf(s.step), d + 1);
        add("back", "back to the check", d);
        break;
      case "Return": add("end", "return " + (s.expr ? srcOf(s.expr) : ""), d); break;
      case "Break": add("proc", "break out", d); break;
      case "Continue": add("proc", "next round", d); break;
    }
  }

  for (let i = 0; i < ast.funcs.length; i++) if (ast.funcs[i].name === "main") m = ast.funcs[i];
  if (!m) m = ast.funcs[0];
  add("start", "START", 0);
  if (m) stmt(m.body, 0);
  add("stop", "STOP", 0);

}

/*  8. MACHINE CODE ENCODER (consistent, illustrative)                 */
/* ------------------------------------------------------------------ */
const OPCODES = { MOV: 0xB8, STORE: 0x89, LEA: 0x8D, ADD: 0x01, SUB: 0x29, IMUL: 0x0F, CMP: 0x39,

  const bytes = [base];

  nums.forEach(function (n) { bytes.push(Math.abs(parseInt(n, 10)) & 255); });
  while (bytes.length < 4) bytes.push((bytes.length * 37 + base) & 255);
  return bytes.slice(0, 4);
}

function astTree(ast) {

  ideas: [
    { h: "Opcode", t: "The first byte(s) say WHICH operation: move, add, jump, compare." },
    { h: "Operands", t: "The following bytes say WHAT to operate on: which register, which address, which literal number." },
    { h: "Instruction Set (ISA)", t: "The full dictionary of a chip family: x86-64, ARM64, RISC-V. Different dictionaries, incompatible binaries." },
    { h: "Endianness", t: "Multi-byte numbers can be stored smallest-byte-first (little-endian, x86) or biggest-first. Look at the byte order in the Memory tab — it is little-endian." }

    label: "Your code, all the way down to bits",

    { type: "mcq", d: "hard", q: "In little-endian storage, the 4-byte int 1 is stored as:", opts: ["00 00 00 01", "01 00 00 00", "01 01 01 01", "It depends on the compiler mood"], a: 1, why: "Little-endian puts the least significant byte at the lowest address. Check it yourself: hover the bytes of any int in the Memory tab." }

    { h: "Byte", t: "Eight bits together. 256 possible patterns. The standard unit memory is measured in." },
    { h: "Place value", t: "Right to left the columns are 1, 2, 4, 8, 16, 32, 64, 128. Add up the columns that are ON." },
    { h: "Hex", t: "Base 16. One hex digit packs exactly 4 bits. Written with 0x in front: 0xFF = 255 = 11111111." }

    { type: "fill", d: "easy", q: "How many different values can ONE byte (8 bits) hold?", answer: ["256", "2^8"], why: "2⁸ = 256 patterns — usually used as 0…255, or −128…127 if signed." },
    { type: "mcq", d: "medium", q: "In C, what is the value of the expression `'A' + 1`?", opts: ["'B' (66)", "An error", "'A1'", "1"], a: 0, why: "A char is a small integer. 'A' is 65, so 'A' + 1 is 66, which printed with %c shows as 'B'." },

    { type: "mcq", d: "hard", q: "Why is hexadecimal used for memory addresses instead of decimal?", opts: ["It looks more professional", "One hex digit maps exactly to 4 bits, so hex mirrors the binary layout precisely", "Hex numbers are smaller", "Decimal cannot represent large numbers"], a: 1, why: "0x2A = 0010 1010 — you can read the bits straight off the digits. Decimal has no such clean relationship with binary." },
    { type: "fill", d: "hard", q: "An `int` is 4 bytes. How many BITS is that?", answer: ["32"], why: "4 × 8 = 32 bits, which is why a signed int reaches about ±2.1 billion (2³¹)." }
  ]

/* ============ 9 ============ */
{
  id: 9, title: "Memory", icon: "🧱", tag: "Deep dive", depth: "deep",
  blurb: "A street of numbered houses. Every variable you ever make lives on it.",
  story: [

    { big: "That street is RAM. The house number is an address. That is the entire model — everything else is detail." },
    "When you write `int x = 5;` the compiler picks four empty houses in a row, say 8196, 8197, 8198, 8199, writes the number 5 across them, and remembers \"x means house 8196\". From then on, `x` is just a nickname for that address.",
    "RAM is split into regions with different jobs. The STACK is neat and automatic — function locals live there and vanish the moment the function ends. The HEAP is a big open field you manage yourself with malloc and free. The DATA segment holds globals that live for the whole program. The CODE segment holds your instructions.",
    "RAM is also forgetful: cut the power and every house is empty again. That is why files exist — the hard disk remembers, but it is roughly 100,000× slower to reach."
  ],
  analogy: { t: "The street of houses", p: "Address = house number. Byte = what's inside the house. Variable name = the name you painted on the gate so you don't have to remember 8196. Pointer = a note in your pocket with a house number written on it." },
  ideas: [
    { h: "Address", t: "A number naming one byte of RAM. Written in hex: 0x2004. `&x` gives you x's address." },
    { h: "Stack", t: "Automatic, fast, ordered. Function locals and parameters. Freed the instant the function returns. Small — a few MB." },
    { h: "Heap", t: "Manual, flexible, large. You call malloc to take memory and free to give it back. Forget to free = memory leak." },
    { h: "Registers vs RAM vs Disk", t: "Registers: ~1 CPU cycle. Cache: ~4. RAM: ~200. SSD: ~500,000. The whole design of computers is fighting this gap." }

  demo: {

    code: '#include <stdio.h>\n\nint main() {\n    int a = 10;\n    int b = 20;\n    char c = \'X\';\n    double d = 3.14;\n\n    printf("a is at %p and holds %d\\n", &a, a);\n    printf("b is at %p and holds %d\\n", &b, b);\n    printf("c is at %p and holds %c\\n", &c, c);\n    printf("d is at %p and holds %.2f\\n", &d, d);\n    return 0;\n}',

  quiz: [
    { type: "mcq", d: "easy", q: "What exactly is a memory address?", opts: ["The value stored in a variable", "A number identifying one byte of memory", "The name of a variable", "The size of a variable"], a: 1, why: "Address = where. Value = what. Confusing these two is the single most common cause of pointer bugs." },
    { type: "mcq", d: "easy", q: "Where do local variables inside a function live?", opts: ["The heap", "The stack", "The hard disk", "The CPU registers only"], a: 1, why: "The stack — which is why they disappear automatically when the function returns. No cleanup needed." },
    { type: "mcq", d: "medium", q: "What happens to everything in RAM when the power goes off?", opts: ["It is saved to disk automatically", "It is lost — RAM is volatile", "It moves to the CPU", "Nothing, RAM is permanent"], a: 1, why: "RAM needs constant power to hold its charge. Anything you want to keep must be written to a file." },
    { type: "mem", d: "medium", q: "After this runs, how many BYTES in total have been reserved for these four variables?", code: 'char a = 1;\nint  b = 2;\nchar c = 3;\ndouble d = 4;', opts: ["4 bytes", "14 bytes", "16 bytes", "8 bytes"], a: 1, why: "1 + 4 + 1 + 8 = 14 bytes of actual data. (Real compilers may add padding between them for alignment — run it and look at the addresses.)" },
    { type: "mcq", d: "hard", q: "Why is the heap needed if the stack already exists?", opts: ["The heap is faster", "The stack is small and its memory dies when the function returns; the heap lets data outlive the function and be sized at run time", "The heap is automatic", "There is no difference"], a: 1, why: "Two real limits: lifetime and size. Anything that must survive the function, or whose size is only known while running, belongs on the heap." },
    { type: "mcq", d: "hard", q: "Roughly how much slower is reading from an SSD than from a CPU register?", opts: ["About 2× slower", "About 100× slower", "About 500,000× slower", "The same speed"], a: 2, why: "Registers ≈1 cycle, SSD ≈500,000 cycles. This gap is why caches, buffers and RAM exist at all." }

/* ============ 10 ============ */
{
  id: 10, title: "Variables", icon: "📦", tag: "Deep dive", depth: "deep",
  blurb: "Named boxes in memory. The first real tool you own.",
  story: [

    { big: "A variable is a labelled box in memory. Name on the outside, value inside, size fixed by its type." },
    "When you write `int score = 0;` three things happen. The compiler reserves 4 bytes of memory. It writes down \"score = address 0x2000\" in its symbol table. Then it stores the number 0 in those bytes.",
    "From then on, writing `score` means \"read the 4 bytes at 0x2000\" and writing `score = 10` means \"overwrite the 4 bytes at 0x2000\". Nothing more mysterious than that.",
    "One box, one value. The moment you put something new in, the old value is gone — memory has no undo. And if you never put anything in, the box still contains whatever the previous program left behind: garbage. That is why we initialise."
  ],
  analogy: { t: "The boxes in your room", p: "You do not memorise \"the third shelf, second from the left\". You write CLOTHES on the box. The computer does not want to remember 0x2000 either — so you write `score` on it. The label is for you; the address is what the machine actually uses." },
  ideas: [
    { h: "Declaration", t: "`int score;` — reserve the box. The type decides how many bytes and how the bits are interpreted." },
    { h: "Initialisation", t: "`int score = 0;` — reserve AND fill. Always do this. An uninitialised variable holds garbage." },
    { h: "Assignment", t: "`score = 10;` — overwrite. Reads right side first, then stores. The old value is destroyed." },
    { h: "Naming rules", t: "Letters, digits, underscore. Cannot start with a digit. Case matters: `Score` and `score` are two different boxes." }
  ],

    note: "Step through with the ▶| button and watch the bytes at score's address change. Line 9 is the classic: read the old value, add 5, write it back."

  quiz: [
    { type: "mcq", d: "easy", q: "Which of these is an INVALID variable name in C?", opts: ["total_marks", "_count", "2ndPlace", "Score2"], a: 2, why: "A name cannot start with a digit. `_count` is legal, though names starting with underscore are usually reserved by convention." },
    { type: "out", d: "easy", q: "What does this print?", code: 'int x = 5;\nx = 8;\nprintf("%d", x);', opts: ["5", "8", "58", "13"], a: 1, why: "Assignment overwrites. After line 2 the box holds 8 and 5 is gone forever." },
    { type: "out", d: "medium", q: "What does this print?", code: 'int a = 3;\nint b = a;\na = 10;\nprintf("%d %d", a, b);', opts: ["10 10", "3 3", "10 3", "3 10"], a: 2, why: "`b = a` copies the VALUE 3 into b's own box. The two boxes are unrelated after that — changing a does nothing to b. (Pointers are how you get the other behaviour.)" },
    { type: "fill", d: "medium", q: "Complete the line so that `age` starts at 18:   int age ____ 18;", answer: ["=", "= "], why: "A single `=` is assignment. `==` is comparison — mixing those two up is a rite of passage for every C programmer." },

    { type: "mcq", d: "hard", q: "Why is `int x;` followed by `printf(\"%d\", x);` dangerous?", opts: ["It always prints 0", "x holds leftover garbage from whatever used that memory before", "It will not compile", "It prints the address"], a: 1, why: "C does not clear memory for you — that would cost time. Uninitialised reads produce unpredictable values and are a real source of bugs." }

    "And types have edges. Put 3000 into a char and it overflows — the extra bits simply fall off the end. Divide two ints and the fraction is thrown away: `7 / 2` is 3, not 3.5. These are not bugs; they are the price of speed and predictability."
  ],
  analogy: { t: "The right container", p: "char is a matchbox, int is a shoebox, double is a suitcase. Choosing a suitcase for one matchstick wastes space; choosing a matchbox for your laundry loses most of it. Both mistakes are common." },

    { h: "char — 1 byte", t: "One character, or a small number −128…127. `'A'` and `65` are the same value." },
    { h: "int — 4 bytes", t: "Whole numbers, roughly −2,147,483,648 to 2,147,483,647. Your default choice." },
    { h: "float / double — 4 / 8 bytes", t: "Numbers with a decimal point. double has more precision — prefer it unless memory is tight." },
    { h: "Integer division", t: "`7 / 2` is 3, because both sides are ints. Write `7.0 / 2` to get 3.5. This bites everyone once." }
  ],
  toy: "typesizes",
  demo: {
    label: "Sizes, ranges and the classic traps",

    { type: "out", d: "easy", q: "What does this print?", code: 'printf("%d", 7 / 2);', opts: ["3.5", "3", "4", "0"], a: 1, why: "Both operands are ints, so C does integer division and discards the remainder. `7 % 2` would give you the leftover 1." },
    { type: "mcq", d: "easy", q: "How many bytes does a `char` occupy?", opts: ["1", "2", "4", "8"], a: 0, why: "Always exactly 1 byte in C — by definition, sizeof(char) is 1." },
    { type: "out", d: "medium", q: "What does this print?", code: 'char c = 66;\nprintf("%c", c);', opts: ["66", "B", "c", "A"], a: 1, why: "%c says 'interpret these bits as a character'. 66 is 'B' in ASCII. Same bits, different lens." },

{
  id: 12, title: "Operators", icon: "➗", tag: "Core", depth: "core",
  blurb: "The verbs of the language: add, compare, combine, flip bits.",
  story: [
    "Variables are the nouns of your program. Operators are the verbs — the things you actually do to values.",
    { big: "Most are exactly what you learned in school. A few are not, and those few cause most beginner bugs." },
    "The arithmetic ones are familiar: + − * /. The odd one is % (modulo), which gives the remainder: 17 % 5 is 2. It is far more useful than it looks — it is how you test for even numbers, wrap around a circle, or pick a random slot.",
    "Comparison operators (< > <= >= == !=) do not give you 'yes' or 'no'. They give you 1 or 0, because C has no separate boolean type. Anything non-zero is true; only zero is false.",
    "And the great trap: `=` means 'put this value in the box'. `==` means 'are these two equal?'. Writing `if (x = 5)` assigns 5 to x and is always true. Every C programmer has done this at least once."
  ],
  analogy: { t: "The clock and modulo", p: "A clock is modulo 12. It is 10 o'clock and you add 5 hours — you get 3, not 15, because (10+5) % 12 = 3. Any time something needs to wrap around, % is the tool." },
  ideas: [
    { h: "Arithmetic", t: "+ − * / %. Remember: int / int throws away the fraction, and % only works on integers." },
    { h: "Comparison", t: "== != < > <= >=. Each produces 1 (true) or 0 (false) — an actual int you can store and print." },
    { h: "Logical", t: "&& (and), || (or), ! (not). They short-circuit: in `a && b`, if a is false, b is never evaluated." },
    { h: "Increment", t: "`i++` uses the old value then adds 1; `++i` adds 1 then uses the new value. Matters inside expressions." }
  ],
  demo: {
    label: "Every operator, live",
    code: '#include <stdio.h>\n\nint main() {\n    int a = 17, b = 5;\n    printf("a + b  = %d\\n", a + b);\n    printf("a - b  = %d\\n", a - b);\n    printf("a * b  = %d\\n", a * b);\n    printf("a / b  = %d  (int division)\\n", a / b);\n    printf("a %% b  = %d  (remainder)\\n", a % b);\n\n    printf("\\ncomparisons give 1 or 0:\\n");\n    printf("a > b  = %d\\n", a > b);\n    printf("a == b = %d\\n", a == b);\n\n    int i = 5;\n    printf("\\ni++ shows %d, then i is %d\\n", i++, i);\n    int j = 5;\n    printf("++j shows %d, and j is %d\\n", ++j, j);\n    return 0;\n}',
    note: "The last two lines are the classic post/pre increment difference. Step through slowly."
  },
  quiz: [
    { type: "out", d: "easy", q: "What does this print?", code: 'printf("%d", 17 % 5);', opts: ["3", "2", "3.4", "0"], a: 1, why: "17 = 5×3 + 2, so the remainder is 2." },
    { type: "mcq", d: "easy", q: "What is the difference between `=` and `==`?", opts: ["No difference", "`=` assigns a value, `==` compares two values", "`=` compares, `==` assigns", "`==` only works with strings"], a: 1, why: "`if (x = 5)` silently assigns and is always true. Modern compilers warn about it — listen to those warnings." },
    { type: "out", d: "medium", q: "What does this print?", code: 'int x = 4;\nprintf("%d %d", x++, x);', opts: ["4 5", "5 5", "4 4", "5 4"], a: 0, why: "`x++` hands over the OLD value 4, then increments. By the time x is read again it is 5. (Mixing both in one printf is legal here but poor style in real code.)" },
    { type: "mcq", d: "medium", q: "How do you test whether an integer n is even?", opts: ["if (n / 2 == 0)", "if (n % 2 == 0)", "if (n == even)", "if (n & even)"], a: 1, why: "Even means 'divides by 2 with no remainder', which is exactly what % 2 == 0 asks." },
    { type: "mcq", d: "hard", q: "In `if (a != 0 && 10 / a > 2)`, why is the order important?", opts: ["It isn't", "&& short-circuits: if a is 0 the right side is never evaluated, avoiding division by zero", "Because && is slower", "Because 10 / a is always 0"], a: 1, why: "Short-circuit evaluation is a safety tool, not just an optimisation. This exact pattern guards divisions and pointer dereferences." }
  ]

    "Getting them wrong is a real bug: hand printf an int but write %f and it will read the wrong number of bytes and print nonsense. The compiler may warn you, but it will not stop you.",

  analogy: { t: "The form with blanks", p: "printf is a printed form: \"Dear ____, you scored ____ marks.\" The %s and %d are the blanks; the arguments after the comma are what you write into them, in order." },

    { h: "%d %f %c %s %p", t: "int, float/double, char, string, pointer. Match the specifier to the type or you get garbage." },
    { h: "Precision", t: "`%.2f` prints exactly two decimal places. `%5d` right-aligns in a 5-wide column — handy for tables." },
    { h: "\\n \\t \\\\", t: "Newline, tab, and a literal backslash. Without \\n everything runs together on one line." },
    { h: "scanf needs &", t: "`scanf(\"%d\", &age);` — you must pass the ADDRESS so scanf knows where to store what it reads." }
  ],

    { type: "out", d: "easy", q: "What does this print?", code: 'printf("A\\nB");', opts: ["A\\nB", "A B", "A then B on the next line", "AB"], a: 2, why: "\\n is one invisible character: newline. The backslash is an escape, not literal text." },
    { type: "out", d: "medium", q: "What does this print?", code: 'printf("%.1f", 3.267);', opts: ["3.267", "3.3", "3.2", "3"], a: 1, why: "%.1f rounds to one decimal place: 3.3." },

/* ============ 14 ============ */

  blurb: "Teaching your program to choose.",
  story: [
    "Every program so far has run straight down the page. Real programs need to choose: if it is raining, take an umbrella.",
    { big: "if (condition) { do this } else { do that }. The condition is any expression — and in C, anything that is not zero counts as true." },
    "The CPU handles this in a beautifully simple way. It compares two values, sets a flag bit inside itself, and then a jump instruction either changes the Program Counter or does not. Branching is literally 'should I move my finger to a different line?'.",
    "You can chain decisions with `else if`, nest them inside each other, and combine conditions with && (both must be true) and || (at least one must be true).",
    "When you are comparing one variable against many fixed values, `switch` is cleaner than a ladder of else-ifs — and don't forget `break`, or execution falls through to the next case."
  ],
  analogy: { t: "The fork in the road", p: "A condition is a signpost at a fork. The CPU reads the sign (compares, sets a flag), then walks left or right (jumps or doesn't). It never walks both paths — which is why one branch's code is simply skipped." },
  ideas: [
    { h: "Truthiness", t: "0 is false. Every other value is true. So `if (x)` means 'if x is not zero'." },
    { h: "else if ladders", t: "Checked top to bottom; the first match wins and the rest are skipped. Order your conditions carefully." },
    { h: "&& and ||", t: "`&&` needs both true, `||` needs at least one. Both short-circuit — the right side may never run." },
    { h: "The dangling else", t: "An `else` always binds to the nearest unmatched `if`. Use braces always, even for one line — it prevents this whole class of bug." }
  ],
  demo: {
    label: "Grading with decisions",
    code: '#include <stdio.h>\n\nint main() {\n    int marks = 76;\n\n    if (marks >= 90) {\n        printf("Grade A — outstanding\\n");\n    } else if (marks >= 75) {\n        printf("Grade B — very good\\n");\n    } else if (marks >= 60) {\n        printf("Grade C — passed\\n");\n    } else {\n        printf("Needs another attempt\\n");\n    }\n\n    if (marks % 2 == 0 && marks > 50) {\n        printf("Also: even number above fifty\\n");\n    }\n    return 0;\n}',
    note: "Step through and watch the Flowchart tab — the diamond lights up as each condition is tested."
  },
  quiz: [
    { type: "out", d: "easy", q: "What does this print?", code: 'int x = 0;\nif (x) printf("yes");\nelse printf("no");', opts: ["yes", "no", "0", "nothing"], a: 1, why: "0 is the only false value in C. Everything else — including −1 and 0.5 — is true." },
    { type: "out", d: "medium", q: "What does this print?", code: 'int m = 85;\nif (m >= 90) printf("A");\nelse if (m >= 80) printf("B");\nelse if (m >= 70) printf("C");', opts: ["A", "B", "BC", "C"], a: 1, why: "The ladder stops at the first true condition. 85 ≥ 80 matches, so C is never even tested." },
    { type: "mcq", d: "medium", q: "What is wrong with `if (x = 5)`?", opts: ["Nothing", "It assigns 5 to x and is always true — it should be `==`", "It will not compile", "It compares wrongly"], a: 1, why: "It assigns, then treats the result (5) as the condition — which is non-zero, so always true. A silent, dangerous bug." },
    { type: "out", d: "hard", q: "What does this print?", code: 'int a = 5, b = 0;\nif (b != 0 && a / b > 1) printf("divided");\nelse printf("safe");', opts: ["divided", "safe", "crash", "0"], a: 1, why: "`b != 0` is false, so && short-circuits and `a / b` is never evaluated. This is the standard way to guard a division." }
  ]
},

  story: [

    { big: "A loop says: keep doing this until the condition stops being true. Three lines of code, a million repetitions." },

    "`for` puts all three on one line and is perfect when you know how many times: `for (int i = 0; i < 5; i++)`. `while` puts only the check on the line and is perfect when you do not know: keep going until the user quits. `do-while` runs the body FIRST and checks afterwards, so the body always runs at least once — think of a menu you must show before asking again.",
    "Nest a loop inside a loop and you get grids, tables, patterns, and matrices. If the outer runs 3 times and the inner runs 3 times, the inner body runs 9 times."
  ],
  analogy: { t: "The staircase", p: "START on step 1. CHECK: is there another step? CHANGE: move up one. A for-loop is that staircase written on one line. Forget to move up and you stand on step 1 forever — that is an infinite loop." },
  ideas: [
    { h: "for", t: "`for (start; check; change)` — use when the number of repetitions is known in advance." },
    { h: "while", t: "`while (check)` — use when you loop until something happens. Set up and update the counter yourself." },
    { h: "do–while", t: "Body runs first, condition checked after, so it always runs at least once. Menus and retry prompts." },
    { h: "break / continue", t: "`break` leaves the loop immediately. `continue` skips the rest of this pass and jumps to the next check." }
  ],
  demo: {
    label: "All three loops, plus nesting",
    code: '#include <stdio.h>\n\nint main() {\n    printf("-- for loop --\\n");\n    for (int i = 1; i <= 5; i++) {\n        printf("%d squared is %d\\n", i, i * i);\n    }\n\n    printf("\\n-- while loop --\\n");\n    int n = 5;\n    while (n > 0) {\n        printf("%d ", n);\n        n--;\n    }\n    printf("liftoff!\\n");\n\n    printf("\\n-- nested loops --\\n");\n    for (int r = 1; r <= 4; r++) {\n        for (int c = 1; c <= r; c++) {\n            printf("* ");\n        }\n        printf("\\n");\n    }\n    return 0;\n}',

    { type: "out", d: "easy", q: "What does this print?", code: 'int i = 3;\nwhile (i > 0) {\n    printf("%d", i);\n    i--;\n}', opts: ["321", "123", "3210", "333"], a: 0, why: "3, then 2, then 1. At i=0 the condition fails and the loop stops." },
    { type: "mcq", d: "medium", q: "What is the key difference between while and do-while?", opts: ["No difference", "do-while always runs its body at least once because the check happens after", "while is faster", "do-while cannot use break"], a: 1, why: "Check-then-run versus run-then-check. Use do-while when the first pass must happen no matter what." },
    { type: "out", d: "medium", q: "How many times does the inner printf run in total?", code: 'for (int i = 0; i < 3; i++)\n    for (int j = 0; j < 4; j++)\n        printf("*");', opts: ["7", "12", "3", "4"], a: 1, why: "3 × 4 = 12. The inner loop restarts completely on every pass of the outer loop." },
    { type: "mcq", d: "hard", q: "Why does `for (int i = 0; i < 5; )` loop forever?", opts: ["Missing semicolon", "There is no change step, so i stays 0 and the condition is always true", "i < 5 is invalid", "It doesn't — it runs 5 times"], a: 1, why: "START, CHECK, CHANGE. Remove the change and the condition can never become false." },
    { type: "out", d: "hard", q: "What does this print?", code: 'for (int i = 1; i <= 5; i++) {\n    if (i == 3) continue;\n    printf("%d", i);\n}', opts: ["12345", "1245", "12", "345"], a: 1, why: "`continue` skips the rest of THIS pass only, so 3 is never printed but the loop carries on. `break` would have stopped it entirely, giving 12." }

{
  id: 16, title: "Functions", icon: "🧩", tag: "Deep dive", depth: "deep",
  blurb: "Name a piece of work once, use it forever. And meet the stack.",
  story: [
    "Your mother does not explain how to make tea every time. She says \"make tea\" and you already know the steps. She named a procedure once and now refers to it by name.",
    { big: "A function is a named block of work: it takes inputs, does something, and gives back an answer." },
    "Every function has four parts: a return type (what comes back), a name, parameters (what goes in), and a body. `int add(int a, int b) { return a + b; }` — takes two ints, gives back one int.",
    "Here is the part most courses skip. When you call a function, the CPU pushes a STACK FRAME: a fresh block of memory holding that call's parameters, its local variables, and the return address — the line to come back to when it's done. When the function returns, the frame is popped and that memory is instantly gone.",
    "This is exactly why recursion works. A function calling itself gets a brand-new frame each time, with its own separate copy of every local variable. Five nested calls means five stacked desks, each with their own private paperwork."
  ],
  analogy: { t: "The stack of desks", p: "Every call gets a clean desk stacked on top of the previous one, with a sticky note saying where to return. Finish the work, hand back the answer, throw the desk away. Recursion is just a very tall pile of desks — which is also why infinite recursion crashes: you run out of room to stack them." },
  ideas: [
    { h: "Signature", t: "`int add(int a, int b)` — return type, name, parameter types. This is the contract." },
    { h: "Pass by value", t: "Arguments are COPIED into the function. Changing a parameter inside does not affect the caller's variable." },
    { h: "Stack frame", t: "Parameters + locals + return address, created on call, destroyed on return. Watch it in the Stack tab." },
    { h: "Recursion", t: "A function that calls itself. Needs a base case that returns without recursing — or the stack overflows." }
  ],
  demo: {
    label: "Calls, frames and recursion",
    code: '#include <stdio.h>\n\nint add(int a, int b) {\n    return a + b;\n}\n\nint factorial(int n) {\n    if (n <= 1) return 1;\n    return n * factorial(n - 1);\n}\n\nint main() {\n    printf("add(3, 4)     = %d\\n", add(3, 4));\n    printf("factorial(5)  = %d\\n", factorial(5));\n    return 0;\n}',
    note: "Open the Stack tab and step through factorial. Watch five frames pile up, then unwind one by one as each returns its answer."
  },
  quiz: [
    { type: "mcq", d: "easy", q: "In `int add(int a, int b)`, what does the first `int` mean?", opts: ["The function name", "The type of value the function returns", "The number of parameters", "Nothing"], a: 1, why: "Return type first, then name, then parameters. `void` there would mean 'gives nothing back'." },
    { type: "out", d: "medium", q: "What does this print?", code: 'void change(int x) { x = 100; }\n\nint main() {\n    int n = 5;\n    change(n);\n    printf("%d", n);\n}', opts: ["100", "5", "0", "error"], a: 1, why: "C passes by VALUE — `change` got a copy. To modify the caller's variable you must pass its address: `change(&n)` with an `int *x` parameter." },
    { type: "mcq", d: "medium", q: "What is stored in a stack frame?", opts: ["Only the return value", "Parameters, local variables and the return address", "The whole program", "Global variables"], a: 1, why: "That trio is exactly what a call needs to run and to find its way home." },
    { type: "out", d: "hard", q: "What does factorial(4) return?", code: 'int factorial(int n) {\n    if (n <= 1) return 1;\n    return n * factorial(n - 1);\n}', opts: ["4", "10", "24", "infinite loop"], a: 2, why: "4×3×2×1 = 24. Four frames stack up, then collapse: 1 → 2 → 6 → 24." },
    { type: "mcq", d: "hard", q: "Why does recursion without a base case crash the program?", opts: ["It runs out of variable names", "Each call pushes a new stack frame until the stack runs out of memory — a stack overflow", "The CPU overheats", "It doesn't crash, it just gets slow"], a: 1, why: "Stack space is finite (typically a few MB). Every call consumes some, and nothing is released until a return happens." },
    { type: "order", d: "hard", q: "Order what happens when a function is called:", items: ["Arguments are evaluated and copied", "A new stack frame is pushed with the return address", "The function body executes", "The return value goes back in a register", "The stack frame is popped"], why: "Evaluate → push → run → return value → pop. Step through the demo with the Stack tab open and watch this exact sequence." }
  ]
},

    "And the danger: C does not check bounds. `marks[100]` on a 60-element array will happily read someone else's memory, and it will not warn you. That single design decision is behind a large share of the security bugs in history."
  ],
  analogy: { t: "The row of lockers", p: "A corridor of identical lockers with one sign at the start: MARKS. Locker 0, 1, 2… No searching required — you know locker 7 is exactly 7 widths from the start. Instant access, every time." },
  ideas: [
    { h: "Contiguous", t: "All elements sit next to each other in memory with no gaps. That is what makes indexing instant." },
    { h: "Zero-based", t: "The first element is [0]. For n elements the last valid index is n−1. Off-by-one errors live here." },
    { h: "Fixed size", t: "The size is decided when you declare it and cannot grow. Need growth? That's the heap (Module 21)." },
    { h: "No bounds check", t: "C will let you read and write past the end. It is your job to stay inside." }
  ],
  demo: {

    { type: "out", d: "easy", q: "What does this print?", code: 'int a[4] = {10, 20, 30, 40};\nprintf("%d", a[2]);', opts: ["20", "30", "2", "40"], a: 1, why: "Counting from 0: a[0]=10, a[1]=20, a[2]=30." },
    { type: "mem", d: "medium", q: "`int a[10];` starts at address 0x2000. What address is `a[3]` at?", opts: ["0x2003", "0x200C", "0x2030", "0x2010"], a: 1, why: "0x2000 + 3 × 4 bytes = 0x2000 + 12 = 0x200C. Address = base + index × element size." },
    { type: "fill", d: "medium", q: "How many BYTES does `int scores[20];` reserve?", answer: ["80"], why: "20 elements × 4 bytes each = 80 bytes, all in one continuous block." },
    { type: "mcq", d: "hard", q: "What happens if you write `a[10] = 5;` on `int a[5];`?", opts: ["The compiler refuses", "It silently overwrites unrelated memory — undefined behaviour", "The array grows", "It stores in a[0]"], a: 1, why: "No bounds checking. It might crash, might corrupt another variable, might appear to work — the worst outcome, because the bug hides." }

/* ============ 18 ============ */
{
  id: 18, title: "Strings", icon: "🔤", tag: "Core", depth: "core",
  blurb: "There is no string type in C. There is a clever trick instead.",
  story: [
    "Python has a string type. Java has one. C does not.",
    { big: "In C, a string is just an array of chars with a hidden zero byte at the end marking where it stops." },
    "`char name[] = \"Srikar\";` creates SEVEN bytes, not six: 'S','r','i','k','a','r' and then '\\0' — the null terminator, the value zero.",
    "That terminator is essential. printf with %s starts at the address you give it and keeps printing characters until it hits a zero. No zero means it keeps walking through memory printing garbage until it hits one by accident — or crashes.",
    "This design is why C strings are fast (no length field to maintain) and dangerous (nothing stops you walking off the end). Functions like strlen count characters until the zero; strcpy copies until the zero. Every one of them trusts that terminator to exist."
  ],
  analogy: { t: "The train with a guard's van", p: "Each carriage is one character. The last carriage is empty and painted differently — that is '\\0'. The driver keeps going until he sees the empty carriage. Remove it and the train never stops." },
  ideas: [
    { h: "Null terminator", t: "The '\\0' byte (value 0) marks the end. \"hi\" needs 3 bytes, not 2." },
    { h: "Just an array", t: "`name[0]` is the first character. You can read and change letters individually." },
    { h: "%s and %c", t: "%s prints from an address until the zero. %c prints exactly one character." },
    { h: "strlen", t: "Counts characters BEFORE the terminator, so strlen(\"hi\") is 2 while the storage is 3 bytes." }

  analogy: { t: "Renting a locker", p: "The stack is a locker the school assigns you for one class and clears automatically. The heap is a locker you rent yourself: it is yours until you hand back the key. Lose the key and nobody can ever use that locker again — that is a memory leak." },

    { h: "free(p)", t: "Hands the block back. After this, p is dangling — set it to NULL immediately." },
    { h: "Leak vs dangling", t: "Leak = you lost the address without freeing. Dangling = you kept using it after freeing. Both are bugs." }

  const e = document.createElement("div");
  e.className = "toast";
  e.innerHTML = '<div class="ti">' + ic + '</div><div><div class="tt">' + esc(t) + '</div>' + (d ? '<div class="td">' + esc(d) + '</div>' : '') + '</div>';
  wrap.appendChild(e);
  setTimeout(() => { e.classList.add("out"); setTimeout(() => e.remove(), 400); }, 3400);
}
function confetti() {
  const c = $("#confetti"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#22d3ee", "#a78bfa", "#f472b6", "#34d399", "#fbbf24"];
  const P = [];
  for (let i = 0; i < 130; i++) P.push({
    x: innerWidth / 2 + (Math.random() - .5) * 260, y: innerHeight / 2 - 60,
    vx: (Math.random() - .5) * 13, vy: Math.random() * -14 - 4,
    s: 4 + Math.random() * 7, c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - .5) * .4
  });
  let t = 0;
  (function loop() {
    ctx.clearRect(0, 0, c.width, c.height); t++;
    P.forEach(p => {
      p.vy += .38; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - t / 110);
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore();
    });
    if (t < 115) requestAnimationFrame(loop); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}
function addXP(n, why) {
  const before = level();
  S.xp += n; S.coins += Math.round(n / 5); save(); paintTop();
  if (level() > before) { toast("🎉", "Level " + level() + " reached!", "Keep going — you are building real intuition."); confetti(); }
  else if (why) toast("⚡", "+" + n + " XP", why);
}
function award(id) {
  if (S.badges[id]) return;
  const b = BADGES.filter(x => x.id === id)[0]; if (!b) return;
  S.badges[id] = Date.now(); save();
  toast(b.ic, "Badge unlocked: " + b.n, b.d); confetti();
}
function checkBadges() {
  if (S.runs >= 1) award("first");
  if (S.runs >= 10) award("runner");
  if (S.stepsTaken >= 50) award("stepper");
  if (S.correct >= 5) award("quiz5");
  if (S.correct >= 25) award("quiz25");
  if (S.done[9]) award("mem");
  if (S.done[19]) award("ptr");
  if (S.done[15]) award("loop");
  if (S.maxDepth >= 5) award("stack");
  if (S.sawError) award("debug");
  if (S.projectsRun.length >= 3) award("builder");
  if (S.streak >= 3) award("streak3");
  const n = Object.keys(S.done).length;
  if (n >= 12) award("half");
  if (n >= 23) award("all");
}

/* ---------------- syntax highlighting ---------------- */
const CKW = ["int", "char", "float", "double", "void", "short", "long", "unsigned", "signed", "const", "static", "struct", "return", "if", "else", "while", "for", "do", "break", "continue", "sizeof"];
const CTY = ["int", "char", "float", "double", "void", "short", "long", "unsigned", "signed", "struct", "const", "static"];
function highlight(code) {
  let out = "", i = 0;
  while (i < code.length) {
    const c = code[i];
    if (c === "/" && code[i + 1] === "/") { let j = code.indexOf("\n", i); if (j < 0) j = code.length; out += '<span class="k-cm">' + esc(code.slice(i, j)) + "</span>"; i = j; continue; }
    if (c === "/" && code[i + 1] === "*") { let j = code.indexOf("*/", i); j = j < 0 ? code.length : j + 2; out += '<span class="k-cm">' + esc(code.slice(i, j)) + "</span>"; i = j; continue; }
    if (c === "#") { let j = code.indexOf("\n", i); if (j < 0) j = code.length; out += '<span class="k-pp">' + esc(code.slice(i, j)) + "</span>"; i = j; continue; }
    if (c === '"' || c === "'") {
      let j = i + 1;
      while (j < code.length && code[j] !== c) { if (code[j] === "\\") j++; j++; }
      j++; out += '<span class="k-str">' + esc(code.slice(i, Math.min(j, code.length))) + "</span>"; i = j; continue;
    }
    if (/[0-9]/.test(c)) { let j = i; while (j < code.length && /[0-9a-fA-FxX.]/.test(code[j])) j++; out += '<span class="k-num">' + esc(code.slice(i, j)) + "</span>"; i = j; continue; }
    if (/[A-Za-z_]/.test(c)) {
      let j = i; while (j < code.length && /[A-Za-z0-9_]/.test(code[j])) j++;
      const w = code.slice(i, j);
      let cls = "k-id";
      if (CTY.indexOf(w) >= 0) cls = "k-ty";
      else if (CKW.indexOf(w) >= 0) cls = "k-kw";
      else if (code[j] === "(") cls = "k-fn";
      out += '<span class="' + cls + '">' + esc(w) + "</span>"; i = j; continue;
    }
    if ("+-*/%=<>!&|^~?:".indexOf(c) >= 0) { out += '<span class="k-op">' + esc(c) + "</span>"; i++; continue; }
    out += esc(c); i++;
  }
  return out;
}

Lab.prototype.mount = function () {
  const root = document.getElementById(this.id);
  if (!root) return;
  this.root = root;
  const self = this;
  this.r = {}; $$("[data-r]", root).forEach(e => self.r[e.getAttribute("data-r")] = e);
  this.r.ta.value = this.code;
  this.paintCode();
  this.r.ta.addEventListener("input", function () { self.code = this.value; self.paintCode(); self.res = null; self.paintAll(); });
  this.r.ta.addEventListener("keydown", function (e) {
    if (e.key === "Tab") { e.preventDefault(); const s = this.selectionStart; this.value = this.value.slice(0, s) + "    " + this.value.slice(this.selectionEnd); this.selectionStart = this.selectionEnd = s + 4; self.code = this.value; self.paintCode(); }
  });
  this.r.ta.addEventListener("scroll", function () { self.r.edwrap.scrollTop = this.scrollTop; });
  root.addEventListener("click", function (e) {
    const b = e.target.closest("[data-a]"); const v = e.target.closest("[data-v]");
    if (b) self.act(b.getAttribute("data-a"));
    if (v) { self.vtab = v.getAttribute("data-v"); $$(".vtab", root).forEach(x => x.classList.toggle("on", x === v)); self.paintPanel(); }
  });
  root.addEventListener("input", function (e) {
    const a = e.target.getAttribute && e.target.getAttribute("data-a");
    if (a === "speed") self.speed = +e.target.value;
    if (a === "scrub") { self.idx = +e.target.value; self.paintAll(); }
  });
  this.paintAll();
  if (this.opts.autorun) setTimeout(() => self.act("run"), 260);
};
Lab.prototype.act = function (a) {
  if (a === "run") return this.run();
  if (a === "play") return this.togglePlay();
  if (a === "next") return this.step(1);
  if (a === "prev") return this.step(-1);
  if (a === "reset") { this.stop(); this.idx = 0; this.paintAll(); }
};
Lab.prototype.paintCode = function () {
  const lines = this.code.split("\n");
  this.r.hl.innerHTML = highlight(this.code) + "\n ";
  this.r.gutter.innerHTML = lines.map((_, i) => "<div data-l=\"" + (i + 1) + "\">" + (i + 1) + "</div>").join("");
  this.r.ta.style.height = Math.max(lines.length * 21 + 28, 200) + "px";
  this.r.hl.style.minHeight = Math.max(lines.length * 21 + 28, 200) + "px";
};
Lab.prototype.run = function () {
  this.stop();
  const self = this;
  let res;
  try { res = CU.run(this.code); }
  catch (e) { res = { ok: false, error: { line: 0, title: "Something unexpected happened", msg: String(e && e.message || e), hint: "" }, trace: [], output: "" }; }
  this.res = res; this.idx = 0;
  S.runs++; if (!res.ok) S.sawError = true;
  res.trace.forEach(t => { if (t.depth > S.maxDepth) S.maxDepth = t.depth; });
  save(); checkBadges();
  if (S.runs === 1) addXP(20, "your first program");
  else if (this.opts.projectId && S.projectsRun.indexOf(this.opts.projectId) < 0) { S.projectsRun.push(this.opts.projectId); save(); addXP(25, "project launched"); }
  // animate the compiler pipeline
  this.pipeStage = 0;
  const total = 9;
  const tick = () => {
    self.pipeStage++;
    if (self.vtab === "comp") self.paintPanel();
    if (self.pipeStage < total) setTimeout(tick, 90);
    else { self.pipeStage = 99; if (self.vtab === "comp") self.paintPanel(); }
  };
  setTimeout(tick, 90);
  this.paintAll();
  if (res.trace.length > 1) this.togglePlay();
};
Lab.prototype.stop = function () { this.playing = false; clearTimeout(this.timer); if (this.r) this.paintControls(); };
Lab.prototype.togglePlay = function () {
  if (!this.res || !this.res.trace.length) return;
  this.playing = !this.playing;
  this.paintControls();
  if (this.playing) this.tick();
  else clearTimeout(this.timer);
};
Lab.prototype.tick = function () {
  const self = this;
  if (!this.playing) return;
  if (this.idx >= this.res.trace.length - 1) { this.playing = false; this.paintControls(); return; }
  this.idx++; S.stepsTaken++; this.paintAll();
  const delay = Math.max(60, 1500 / this.speed);
  this.timer = setTimeout(() => self.tick(), delay);
};
Lab.prototype.step = function (d) {
  if (!this.res || !this.res.trace.length) { if (d > 0) this.run(); return; }
  this.stop();
  this.idx = clamp(this.idx + d, 0, this.res.trace.length - 1);
  if (d > 0) { S.stepsTaken++; if (S.stepsTaken % 25 === 0) save(); checkBadges(); }
  this.paintAll();
};
Lab.prototype.cur = function () { return this.res && this.res.trace[this.idx]; };

Lab.prototype.paintAll = function () {
  this.paintControls(); this.paintGutter(); this.paintOutput(); this.paintPanel(); this.paintNarr();
};
Lab.prototype.paintControls = function () {
  const n = this.res ? this.res.trace.length : 0;
  const sc = $('[data-a="scrub"]', this.root);
  sc.max = Math.max(0, n - 1); sc.value = this.idx; sc.disabled = !n;
  this.r.count.textContent = n ? ("step " + (this.idx + 1) + " / " + n) : "not run yet";
  const pb = $('[data-a="play"]', this.root);
  pb.innerHTML = (this.playing ? I.pause + " Pause" : I.play + " Play");
  $$('[data-a="next"],[data-a="prev"]', this.root).forEach(b => b.disabled = !n);
};
Lab.prototype.paintGutter = function () {
  const c = this.cur();
  $$("#" + this.id + " .gutter div").forEach(d => { d.className = ""; });
  this.r.hlline.style.display = "none";
  const errLine = this.res && this.res.error ? this.res.error.line : 0;
  if (errLine) { const g = $('#' + this.id + ' .gutter div[data-l="' + errLine + '"]'); if (g) g.className = "err"; }
  if (!c || !c.line) return;
  const g = $('#' + this.id + ' .gutter div[data-l="' + c.line + '"]');
  if (g) g.className = c.kind === "error" ? "err" : "cur";
  this.r.hlline.style.display = "block";
  this.r.hlline.className = "hl-line" + (c.kind === "error" ? " err" : "");
  this.r.hlline.style.top = (14 + (c.line - 1) * 21) + "px";
  const wrap = this.r.edwrap, top = 14 + (c.line - 1) * 21;
  if (top < wrap.scrollTop + 20 || top > wrap.scrollTop + wrap.clientHeight - 40)
    wrap.scrollTop = Math.max(0, top - wrap.clientHeight / 2);
};
Lab.prototype.paintOutput = function () {
  const c = this.cur();
  const txt = c ? c.out : "";
  this.r.out.innerHTML = txt ? esc(txt) + '<span class="outcaret"></span>'
    : (this.res ? '<span style="color:#65708c">(no output yet at this step)</span>' : 'Press <b>Run</b> to execute this program.');
  this.r.exit.textContent = this.res && this.idx === this.res.trace.length - 1 && this.res.ok ? ("exit code " + this.res.exitCode) : "";
  const e = this.res && this.res.error;
  this.r.err.innerHTML = !e ? "" :
    '<div class="errbox"><div class="et">⚠ ' + esc(e.title) + (e.line ? '  <span style="font-weight:400;color:var(--txt3);font-size:12px">line ' + e.line + '</span>' : '') + '</div>' +
    '<p>' + esc(e.msg) + '</p>' + (e.hint ? '<div class="fix"><b>How to fix it</b>\n' + esc(e.hint) + '</div>' : '') + '</div>';
};
Lab.prototype.paintNarr = function () {
  const c = this.cur();
  if (!c) { this.r.ntitle.textContent = "Ready"; return; }
  this.r.ntitle.textContent = c.title || "step";
  this.r.nwhy.textContent = c.why || "";
  if (S.voice && c.why && this.lastSpoke !== c.n) {
    this.lastSpoke = c.n;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(c.why); u.rate = 1.05; speechSynthesis.speak(u); } catch (err) { }
  }
};

/* ---------- panels ---------- */
Lab.prototype.paintPanel = function () {
  const b = this.r.vbody;
  const c = this.cur();
  const map = { mem: "Memory", cpu: "Cpu", stack: "Stack", comp: "Comp", asm: "Asm", flow: "Flow", pseudo: "Pseudo", loop: "Loop" };
  b.innerHTML = this["panel" + map[this.vtab]](c);
  if (this.vtab === "mem") this.drawArrows();
  bindTips(b);
};
Lab.prototype.panelMemory = function (c) {
  if (!c) return empty("🧱", "Run the program to watch memory fill up", "Every variable will claim real bytes at real addresses. Hover any byte to inspect it.");
  const groups = { global: [], stack: [] };
  c.vars.forEach(v => { (v.seg === "global" ? groups.global : groups.stack).push(v); });
  const frames = c.frames;
  let h = '<svg id="arrows"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f472b6"/></marker></defs></svg>';
  h += '<div class="segs">';
  if (groups.global.length) {
    h += seg("DATA segment · globals", "live for the whole program", hexRange(CU.SEG.DATA),
      groups.global.map(v => varRow(v, c)).join(""));
  }
  let sb = "";
  frames.forEach((f, i) => {
    const vs = groups.stack.filter(v => v.frame === f.id);
    sb += '<div class="frameGrp' + (i === frames.length - 1 ? " top" : "") + '">' +
      '<div class="fname">▸ ' + esc(f.fn) + '()' + (f.args ? ' <span style="color:var(--txt3);font-weight:500;text-transform:none;letter-spacing:0">' + esc(f.args) + '</span>' : '') +
      (i === frames.length - 1 ? ' <span class="tag v" style="margin-left:auto">running</span>' : '') + '</div>' +
      (vs.length ? vs.map(v => varRow(v, c)).join("") : '<div style="font-size:12px;color:var(--txt3);padding:4px 8px">no locals yet</div>') + '</div>';
  });
  h += seg("STACK · function locals", "created and destroyed automatically", hexRange(CU.SEG.STACK), sb || '<div style="font-size:12px;color:var(--txt3)">stack is empty</div>');
  if (c.heap.length) {
    h += seg("HEAP · malloc", "yours until you free it", hexRange(CU.SEG.HEAP),
      c.heap.map(bk => '<div class="heapblk' + (bk.freed ? " freed" : "") + '">' +
        '<div style="display:flex;gap:9px;align-items:center;margin-bottom:7px"><b class="mono" style="font-size:12px">' + hex(bk.addr) + '</b>' +
        '<span class="tag ' + (bk.freed ? "p" : "g") + '">' + (bk.freed ? "freed" : "in use") + '</span>' +
        '<span style="font-size:11px;color:var(--txt3)">' + bk.size + ' bytes</span></div>' +
        '<div class="cellbytes" style="flex-wrap:wrap">' + bk.bytes.slice(0, 40).map(by => byteBox(by, c)).join("") + '</div></div>').join(""));
  }
  h += '</div>';
  h += '<div style="margin-top:16px;font-size:11.5px;color:var(--txt3);line-height:1.65">' +
    'Bytes are shown in <b>hexadecimal</b>, lowest address first (little-endian). Hover any byte for its address, decimal value, bits and character.</div>';
  return h;
};
function hexRange(a) { return hex(a) + " …"; }
function seg(title, sub, rng, inner) {
  return '<div class="seg"><div class="seghead">' + esc(title) +
    ' <span style="font-weight:500;letter-spacing:0;text-transform:none;opacity:.7">' + esc(sub) + '</span>' +
    '<span class="rng">' + rng + '</span></div><div class="segbody">' + inner + '</div></div>';
}
function byteBox(by, c) {
  const hot = c && c.hi.indexOf(by.a) >= 0;
  return '<div class="byte' + (by.set ? " set" : "") + (hot ? " hot" : "") + '" data-tip="' +
    esc("address " + hex(by.a) + "\nhex  0x" + by.b.toString(16).toUpperCase().padStart(2, "0") +
      "\ndec  " + by.b + "\nbits " + bin8(by.b) + (by.b >= 32 && by.b < 127 ? "\nchar '" + String.fromCharCode(by.b) + "'" : "")) +
    '">' + by.b.toString(16).toUpperCase().padStart(2, "0") + '</div>';
}
function fmtCell(v, cell) {
  if (v.ptr > 0) return cell.val === 0 ? "NULL" : hex(cell.val);
  if (v.isFloat) return Number(cell.val).toFixed(2);
  if (v.isChar) { const ch = cell.val; return ch >= 32 && ch < 127 ? "'" + String.fromCharCode(ch) + "'" : String(ch); }
  return String(cell.val);
}
function varRow(v, c) {
  const hit = c.hi.some(a => a >= v.addr && a < v.addr + v.size);
  let cells = v.cells.map((cell, i) =>
    '<div class="cell" data-addr="' + cell.addr + '">' +
      '<div class="cellbytes">' + cell.bytes.map(by => byteBox(by, c)).join("") + '</div>' +
      '<div class="cellval">' + esc(cell.init ? fmtCell(v, cell) : "?") + '</div>' +
      (v.count > 1 ? '<div class="cellidx">[' + i + ']</div>' : '') +
    '</div>').join("");
  if (v.count > 12) cells = v.cells.slice(0, 12).map((cell, i) =>
    '<div class="cell" data-addr="' + cell.addr + '"><div class="cellbytes">' + cell.bytes.map(by => byteBox(by, c)).join("") +
    '</div><div class="cellval">' + esc(cell.init ? fmtCell(v, cell) : "?") + '</div><div class="cellidx">[' + i + ']</div></div>').join("") +
    '<div style="font-size:11px;color:var(--txt3);align-self:center">+' + (v.count - 12) + ' more</div>';
  return '<div class="varrow' + (hit ? " hit" : "") + '"' + (v.ptr > 0 ? ' data-ptr="' + v.cells[0].val + '"' : '') + '>' +
    '<div class="vlabel"><div class="vn">' + esc(v.name) + (v.count > 1 ? "[" + v.count + "]" : "") + '</div>' +
    '<div class="vt">' + esc(v.type) + ' · ' + v.size + 'B</div></div>' +
    '<div class="vaddr">' + hex(v.addr) + '</div>' +
    '<div class="cells">' + cells + '</div>' +
    (v.ptr > 0 && v.cells[0].val ? '<span class="ptrbadge">→ ' + hex(v.cells[0].val) + '</span>' : '') +
    '</div>';
}
Lab.prototype.drawArrows = function () {
  const b = this.r.vbody, svg = $("#arrows", b);
  if (!svg) return;
  const br = b.getBoundingClientRect();
  svg.setAttribute("width", b.scrollWidth); svg.setAttribute("height", b.scrollHeight);

  cpucycle: {
    html: function () {
      return '<div class="card"><h3>Be the CPU</h3>' +
        '<p style="font-size:13.5px">Press the button to advance one stage. This is the loop your processor runs three billion times a second.</p>' +
        '<div class="cycle" style="margin:20px 0" data-r="cyc"></div>' +
        '<div class="regs" style="max-width:420px" data-r="regs"></div>' +
        '<div data-r="say" style="margin:16px 0;font-size:13.5px;line-height:1.65;color:var(--txt2);min-height:48px"></div>' +

      const prog = [
        { asm: "MOV  R0, #6", d: "load the number 6 into register R0" },
        { asm: "MOV  R1, #7", d: "load the number 7 into register R1" },
        { asm: "MUL  R2, R0, R1", d: "multiply R0 by R1, answer into R2" },
        { asm: "STORE R2, [0x2008]", d: "copy R2 into the variable c in RAM" }
      ];
      let pc = 0, stage = 0;
      const regs = { PC: 0x401000, IR: "—", R0: 0, R1: 0, R2: 0 };
      const names = ["FETCH", "DECODE", "EXECUTE"];
      function paint() {
        r.cyc.innerHTML = names.map((n, i) => '<div class="cyc' + (i === stage ? " on" : "") + '">' + n + '</div>').join("");
        r.regs.innerHTML = reg("PC", hex(regs.PC, 6)) + '<div class="reg wide"><span class="rn">IR</span><span class="rv">' + esc(regs.IR) + '</span></div>' +
          reg("R0", regs.R0) + reg("R1", regs.R1) + reg("R2", regs.R2) + reg("cycle", pc + 1 + " / " + prog.length);
      }
      r.next.addEventListener("click", () => {
        const ins = prog[pc];
        if (stage === 0) { regs.IR = ins.asm; r.say.innerHTML = '<b>FETCH</b> — the CPU read the instruction at address ' + hex(regs.PC, 6) + ' out of RAM and put it in the Instruction Register.'; stage = 1; }
        else if (stage === 1) { r.say.innerHTML = '<b>DECODE</b> — the control unit works out what <span class="icode">' + esc(ins.asm) + '</span> means: ' + ins.d + '.'; stage = 2; }
        else {
          if (pc === 0) regs.R0 = 6; if (pc === 1) regs.R1 = 7; if (pc === 2) regs.R2 = regs.R0 * regs.R1;
          r.say.innerHTML = '<b>EXECUTE</b> — done. ' + (pc === 2 ? 'The ALU multiplied and R2 now holds <b style="color:var(--amber)">42</b>.' : pc === 3 ? 'The value was written to RAM. Program complete — press again to restart.' : 'Register updated.') +
            ' The Program Counter moves to the next instruction.';
          regs.PC += 4; stage = 0; pc = (pc + 1) % prog.length;
          if (pc === 0) { regs.R0 = 0; regs.R1 = 0; regs.R2 = 0; }
        }
        paint();
      });
      paint();
      r.say.innerHTML = 'The Program Counter is at ' + hex(regs.PC, 6) + '. Press the button to fetch the first instruction.';
    }
  }
};
